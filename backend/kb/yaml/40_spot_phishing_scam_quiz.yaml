title_en: "How to Spot Phishing — 'Is This Message a Scam?' Checklist"
title_hi: "फर्जी मैसेज/लिंक (Phishing) कैसे पहचानें — जांच चेकलिस्ट"
summary_en: "Unsure if a message, call, or link is real or a scam? Tick the red flags below — even ONE 'Yes' means STOP and verify officially."
summary_hi: "क्या कोई कॉल, मैसेज या लिंक असली है या ठगी? नीचे दिए संकेतों को टिक करके जांचें — इनमें से एक भी बात दिखे तो तुरंत रुक जाएं!"
keywords_en:
