  - "scam test quiz"
  - "identify fake sms"
keywords_hi:
  - "फर्जी मैसेज कैसे पहचानें"
  - "यह लिंक असली है या नकली"
  - "स्कैम चेकलिस्ट"
  - "फिशिंग कैसे रोकें"
keywords_hinglish:
