sample_queries:
  - "Is this SMS or WhatsApp link a scam? How do I check?"
  - "Fake message aur asli message kaise pehchane"
  - "यह मैसेज या लिंक असली है या ठगी कैसे पता लगाएं"
answer_en:
  - "Red Flag 1 — Urgency or Fear: Does it threaten 'account blocked tonight', 'electricity cut in 2 hours', or 'police arrest warrant'?"
  - "Red Flag 2 — Too Good to Be True: Does it promise free gifts, lottery, ₹5,000 daily part-time job, or huge stock profits?"
  - "Red Flag 3 — Suspicious Link or .apk File: Does the link use bit.ly, random letters, misspelled domains (like 'sbi-kyc-update.xyz' instead of official site), or end in '.apk'?"
  - "Red Flag 4 — Asking Secrets or Screen Share: Does it ask for OTP, PIN, CVV, Aadhaar photo, or installing AnyDesk / QuickSupport?"
  - "Red Flag 5 — Personal Number for Official Work: Did a 'Bank / Electricity / Customs Officer' call from a regular 10-digit mobile number or WhatsApp?"
  - "Red Flag 6 — Asking Money to Receive Money: Does it ask you to scan a QR code or enter UPI PIN to RECEIVE a refund, prize, or OLX payment?"
  - "Golden Action: If ANY red flag applies, DO NOT click, reply, or pay. Independently check inside your official bank/service app or call the official number printed on your card/bill."
answer_hi:
  - "खतरे का संकेत 1 — डर या जल्दबाजी: क्या मैसेज में 'आज रात खाता/बिजली बंद हो जाएगी' या 'पुलिस केस/वारंट' की धमकी दी गई है?"
  - "खतरे का संकेत 2 — लालच या बहुत बड़ा ऑफर: क्या मुफ्त गिफ्ट, लॉटरी, घर बैठे रोज ₹5,000 कमाई या शर्तिया मुनाफे का लालच दिया गया है?"
  - "खतरे का संकेत 3 — संदिग्ध लिंक या .apk फाइल: क्या लिंक bit.ly जैसा छोटा है, वेबसाइट की स्पेलिंग अजीब है (जैसे sbi-update.xyz), या फाइल के अंत में '.apk' लिखा है?"
  - "खतरे का संकेत 4 — OTP/PIN या स्क्रीन शेयर मांगना: क्या आपसे OTP, ATM पिन, CVV मांगा जा रहा है या AnyDesk जैसा ऐप डालने को कहा गया है?"
  - "खतरे का संकेत 5 — सरकारी काम के लिए पर्सनल मोबाइल नंबर: क्या बैंक, बिजली या पुलिस के नाम से किसी साधारण 10-अंक के मोबाइल या WhatsApp से कॉल/मैसेज आया है?"
  - "खतरे का संकेत 6 — पैसे पाने के लिए पैसे/पिन मांगना: क्या इनाम, रिफंड या OLX पेमेंट लेने के नाम पर QR स्कैन या UPI पिन डालने को कहा जा रहा है?"
  - "सही कदम: ऊपर से एक भी संकेत दिखे तो तुरंत रुक जाएं — लिंक न खोलें। खुद अपने आधिकारिक ऐप में जाकर जांचें या कार्ड/बिल पर छपे असली नंबर पर कॉल करें।"
