id: "olx_qr_fraud"
category: "financial_fraud"
urgency: "emergency"
title_en: "OLX / Marketplace / QR Code Scan Scam"
title_hi: "OLX / फेसबुक मार्केटप्लेस और QR कोड स्कैन की ठगी"
summary_en: "Scanning a QR code or entering your UPI PIN NEVER puts money into your account — it only deducts money. Act fast if scammed."
summary_hi: "ध्यान रखें: पैसे लेने के लिए कभी भी QR कोड स्कैन या UPI पिन डालने की जरूरत नहीं होती। अगर ऐसा होकर पैसे कटे हैं तो तुरंत 1930 पर कॉल करें।"
keywords_en:
  - "olx fraud"
  - "qr code scam"
  - "army officer olx scam"
  - "facebook marketplace fraud"
  - "scanned qr code money deducted"
  - "receive money qr scam"
keywords_hi:
  - "ओएलएक्स फ्रॉड"
  - "क्यूआर कोड स्कैन ठगी"
  - "फौजी बनकर ठगी"
  - "पैसे मिलने की जगह कट गए"
keywords_hinglish:
  - "olx par fraud ho gaya"
  - "qr code scan karne par paise kat gaye"
  - "army officer bol kar olx scam kiya"
  - "paise bhejne ke naam par qr bheja"
  - "pin dalne par paise kat gaye"
sample_queries:
  - "Someone sent QR code on OLX to pay me and money got deducted"
  - "QR code scan karke paise kat gaye"
  - "ओएलएक्स पर सामान बेचते समय ठगी हो गई"
  - "Fake army buyer scammed me on Facebook Marketplace"
  - "Paisa lene ke liye UPI pin dala aur paise cut gaye"
answer_en:
  - "Call 1930 immediately with the transaction UTR number and amount deducted."
  - "Golden Rule to remember: you NEVER need to enter a UPI PIN or scan a QR code to RECEIVE money — PIN is only for PAYING."
  - "Inform your bank helpline immediately to flag the fraudulent transaction."
  - "Take screenshots of the OLX/Facebook listing, WhatsApp chats, fake Army/CISF ID card sent by the fraudster, QR code image, and payment receipt."
  - "Do NOT fall for follow-up calls saying 'click/scan again to get a refund' — block the number."
  - "Report on cybercrime.gov.in and also report the fraudster's profile inside the OLX/Facebook app."
answer_hi:
  - "तुरंत 1930 पर कॉल करें और कटी हुई रकम व UTR ट्रांज़ैक्शन नंबर बताएं।"
  - "हमेशा याद रखें: पैसे लेने के लिए कभी भी QR कोड स्कैन करने या UPI पिन डालने की जरूरत नहीं होती। पिन केवल पैसे भेजने के लिए होता है।"
  - "तुरंत अपने बैंक कस्टमर केयर को धोखाधड़ी की सूचना दें।"
  - "OLX/फेसबुक विज्ञापन, व्हाट्सएप चैट, ठग द्वारा भेजा गया नकली फौजी आईडी कार्ड, QR कोड फोटो और पेमेंट स्क्रीनशॉट संभाल कर रखें।"
  - "यदि ठग दोबारा कॉल करके कहे कि 'पैसा वापस पाने के लिए फिर से QR स्कैन करें', तो बिल्कुल न करें और नंबर ब्लॉक करें।"
  - "cybercrime.gov.in पर शिकायत दर्ज करें और OLX/फेसबुक ऐप में भी उस प्रोफाइल को रिपोर्ट करें।"
