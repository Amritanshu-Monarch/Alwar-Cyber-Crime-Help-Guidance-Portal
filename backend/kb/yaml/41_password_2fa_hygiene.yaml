id: "password_hygiene"
category: "cyber_hygiene"
urgency: "normal"
title_en: "Password, UPI PIN & Two-Factor Authentication (2FA) Hygiene"
title_hi: "मजबूत पासवर्ड, UPI पिन और 2-Step सुरक्षा (2FA) के नियम"
summary_en: "Most social media and bank hacks happen because of weak, reused passwords (like mobile numbers or birthdays) and missing 2FA."
summary_hi: "ज्यादातर खाते कमजोर पासवर्ड (जैसे मोबाइल नंबर या जन्मतिथि) और Two-Factor सुरक्षा बंद होने के कारण हैक होते हैं। आसान नियमों से खुद को सुरक्षित रखें।"
keywords_en:
  - "password hygiene"
  - "strong password tips"
  - "two factor authentication 2fa"
  - "secure upi pin"
  - "protect accounts from hacking"
keywords_hi:
  - "मजबूत पासवर्ड कैसे बनाएं"
  - "टू फैक्टर ऑथेंटिकेशन"
  - "खाता सुरक्षित कैसे रखें"
  - "यूपीआई पिन सुरक्षा"
keywords_hinglish:
  - "strong password kaise banaye"
  - "2fa kaise lagaye"
  - "account hack hone se kaise bachaye"
sample_queries:
  - "How should I make a strong password and secure my accounts?"
  - "Two-factor authentication 2FA kaise lagaye"
  - "मजबूत पासवर्ड और सुरक्षित UPI पिन कैसे बनाएं"
answer_en:
  - "1. Never Use Easy Guesses: Never set your phone number, birth year, '123456', '112233', or your name as a password or UPI/ATM PIN."
  - "2. Use Passphrases: Combine 3-4 easy-to-remember words + numbers + symbols (e.g., 'Alwar@Tea2025!'). Keep at least 12 characters for email and banking."
  - "3. Separate Passwords for Critical Accounts: NEVER reuse your Gmail or banking password on random shopping/gaming websites."
  - "4. Turn ON 2-Step Verification (2FA) Everywhere: Enable Two-Step PIN on WhatsApp, 2SV on Gmail, and 2FA on Instagram/Facebook (prefer an Authenticator App over SMS when possible)."
  - "5. Separate Phone Lock from UPI PIN: Never keep your phone screen unlock PIN and your UPI PIN the exact same number."
  - "6. Never Save Banking Passwords on Shared Computers or Cyber Cafes — always use Incognito/Private mode and Log Out completely."
answer_hi:
  - "1. आसान पासवर्ड/पिन कभी न रखें: अपना मोबाइल नंबर, जन्मतिथि, '123456', '0000' या अपना नाम कभी भी पासवर्ड या UPI/ATM पिन न बनाएं।"
  - "2. याद रहने वाला मजबूत पासवर्ड बनाएं: 3-4 शब्दों के साथ नंबर और चिह्न मिलाएं (जैसे 'Alwar@Chai2025!')। खासकर Gmail और बैंक का पासवर्ड कम से कम 10-12 अक्षरों का रखें।"
  - "3. हर जरूरी खाते का अलग पासवर्ड रखें: अपने Gmail और बैंक वाला पासवर्ड किसी साधारण शॉपिंग या गेमिंग साइट पर कभी न डालें।"
  - "4. हर जगह Two-Step Verification (2FA) चालू करें: WhatsApp में Two-step PIN, Gmail में 2-Step Verification और Instagram/Facebook में Two-Factor सुरक्षा जरूर ऑन करें।"
  - "5. फोन लॉक और UPI पिन अलग रखें: आपके मोबाइल का स्क्रीन लॉक और बैंक/UPI पिन कभी एक जैसे नहीं होने चाहिए।"
  - "6. ई-मित्र या साइबर कैफे के कंप्यूटर पर पासवर्ड Save न करें और काम खत्म होते ही Log out जरूर करें।"
