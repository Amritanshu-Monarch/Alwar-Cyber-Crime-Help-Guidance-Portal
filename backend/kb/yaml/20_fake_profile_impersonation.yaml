id: "fake_profile_impersonation"
category: "social_media"
urgency: "high"
title_en: "Fake Profile / Impersonation & Content Takedown"
title_hi: "नकली सोशल मीडिया प्रोफाइल (Fake ID) और पोस्ट हटवाने का तरीका"
summary_en: "Someone created a fake Instagram, Facebook, or X account using your photos or name? Preserve proof, report inside the platform for impersonation, and file on NCRP."
summary_hi: "किसी ने आपकी फोटो या नाम से नकली Facebook/Instagram/X आईडी बना ली है? सबूत सुरक्षित करें, ऐप के अंदर Impersonation रिपोर्ट करें और NCRP पर शिकायत दर्ज करें।"
keywords_en:
  - "fake profile"
  - "impersonation"
  - "fake instagram account using my photos"
  - "fake facebook id"
  - "take down fake account"
  - "content takedown"
keywords_hi:
  - "नकली प्रोफाइल"
  - "फेक आईडी बना ली"
  - "मेरी फोटो से नकली अकाउंट"
  - "फर्जी इंस्टाग्राम आईडी"
  - "पोस्ट कैसे हटवाएं"
keywords_hinglish:
  - "fake id banayi hai mere naam se"
  - "meri photo use karke fake instagram account banaya"
  - "fake facebook profile kaise hatwaye"
  - "impersonation report kaise kare"
sample_queries:
  - "Someone made a fake Instagram profile with my photos"
  - "Mere naam se fake Facebook ID bana li hai kaise band karwaye"
  - "किसी ने मेरी फोटो लगाकर नकली इंस्टाग्राम अकाउंट बना लिया है"
  - "How to take down fake profile and abusive posts"
answer_en:
  - "1. Prepare Essential Evidence Checklist: (a) Clear incident description (impersonation, photo misuse, extortion), (b) Screenshots of the fake profile and abusive chats, (c) Exact Profile link / Username / ID, and (d) Your real name, contact email, and mobile number."
  - "2. In-App Report: Tap the 3 dots on the fake profile -> Report -> Pretending to be someone -> Me."
  - "3. Direct Report to Platform Grievance Officer: If in-app reporting doesn't work, submit directly to the Grievance Officer: Meta (Instagram/FB): https://help.meta.com/requests/1371776380779082/ | X (Twitter): https://help.x.com/en/forms/report-to-grievance-officer-india | WhatsApp: https://www.whatsapp.com/contact/forms/1534459096974129 | Google: https://www.google.com/intl/en_in/contact/grievance-officer.html."
  - "4. Escalate to Government of India GAC: Under IT Rules 2021, if the platform does not reply within 15 days or the reply is unsatisfactory, appeal to the Grievance Appellate Committee (GAC) at https://gac.gov.in/ within 30 days."
  - "5. Police & Cyber Crime Reporting: For extortion, threats, morphed/sexual content, or financial scamming, report immediately at https://cybercrime.gov.in or visit your nearest Police Thana / Alwar Cyber Cell (Helpline: 8764874306)."
  - "6. Safety Measure: Set your own genuine account to Private temporarily and caution friends not to entertain requests from the fake ID."
answer_hi:
  - "1. शिकायत चेकलिस्ट तैयार करें: (क) घटना का स्पष्ट विवरण (नकली आईडी / फोटो का दुरुपयोग / धोखाधड़ी), (ख) प्रोफाइल व चैट के स्क्रीनशॉट, (ग) नकली प्रोफाइल का पूरा लिंक (URL) व यूज़रनेम, (घ) आपका असली नाम, ईमेल व मोबाइल नंबर।"
  - "2. ऐप के भीतर रिपोर्ट करें: नकली प्रोफाइल पर 3 डॉट्स दबाएं -> Report -> Pretending to be someone -> Me चुनें।"
  - "3. Grievance Officer को सीधे भेजें: यदि ऐप से आईडी न हटे तो सीधे Grievance Officer फॉर्म भरें: Meta (FB/Insta): https://help.meta.com/requests/1371776380779082/ | X (Twitter): https://help.x.com/en/forms/report-to-grievance-officer-india | WhatsApp: https://www.whatsapp.com/contact/forms/1534459096974129 | Google: https://www.google.com/intl/en_in/contact/grievance-officer.html।"
  - "4. भारत सरकार GAC में अपील: यदि प्लेटफॉर्म 15 दिनों में कोई उत्तर न दे या समाधान असंतोषजनक हो, तो 30 दिनों के भीतर Grievance Appellate Committee (GAC) पोर्टल https://gac.gov.in/ पर अपील दायर करें।"
  - "5. पुलिस व NCRP में तुरंत शिकायत: अगर ब्लैकमेल, अश्लील फोटो, पैसे की ठगी या गंभीर धमकी दी जा रही है, तो तुरंत 1930, cybercrime.gov.in या नजदीकी थाना / अलवर साइबर सेल (8764874306) में शिकायत करें।"
  - "6. सुरक्षा सलाह: अपनी असली प्रोफाइल को कुछ समय के लिए Private कर लें और परिचितों को सूचित कर दें कि उस फर्जी आईडी को ब्लॉक व रिपोर्ट करें।"
