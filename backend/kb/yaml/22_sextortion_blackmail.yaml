id: "sextortion_blackmail"
category: "social_media"
urgency: "emergency"
title_en: "Sextortion / Video Call Blackmail — Do Not Pay!"
title_hi: "वीडियो कॉल ब्लैकमेल (Sextortion) — पैसे न दें, तुरंत यह करें"
summary_en: "Scammers record fake/intimate WhatsApp or Facebook video calls and threaten to send them to your contacts unless paid. NEVER pay — paying makes demands endless."
summary_hi: "अनजान वीडियो कॉल रिकॉर्ड करके पैसे मांगने और बदनाम करने की धमकी दे रहे हैं? एक रुपया भी न दें, चैट डिलीट न करें और तुरंत ब्लॉक व रिपोर्ट करें।"
keywords_en:
  - "sextortion"
  - "video call blackmail"
  - "whatsapp nude video call scam"
  - "blackmailing for money video"
  - "fake police youtube upload threat"
keywords_hi:
  - "सेक्सटॉर्शन"
  - "वीडियो कॉल ब्लैकमेल"
  - "गंदी वीडियो रिकॉर्ड करके धमकी"
  - "यूट्यूब पर डालने की धमकी"
  - "ब्लैकमेल से पैसे मांगना"
keywords_hinglish:
  - "video call blackmail ho raha hai"
  - "sextortion scam ho gaya"
  - "ladki ki video call record karke paise mang raha hai"
  - "youtube par video dalne ki dhamki de raha hai"
  - "nude video call fraud"
sample_queries:
  - "Someone recorded a WhatsApp video call and is blackmailing me for money"
  - "Video call blackmail ho raha hai kya karu paise maang rahe hain"
  - "किसी ने वीडियो कॉल रिकॉर्ड करके पैसे मांगने की धमकी दी है"
  - "Fake cyber police calling after video call blackmail"
answer_en:
  - "1. DO NOT PAY A SINGLE RUPEE: Paying never stops blackmail — scammers immediately ask for more money (and often pose next as fake 'Cyber Police' or 'YouTube officer' demanding 'removal fees')."
  - "2. DO NOT DELETE CHATS OR EVIDENCE: Keep screenshots of the blackmailer's phone number, WhatsApp/Facebook profile, call logs, UPI IDs/bank accounts they sent, and threatening messages."
  - "3. Lock & Privatize Social Media Immediately: Set Facebook, Instagram, and LinkedIn to Private, hide your Friends/Followers list, and temporarily deactivate or restrict unknown message requests."
  - "4. Block & Cut Contact Completely: Block the caller's number and social profile. Do not reply, plead, or argue — once scammers see zero payment and blocked communication, they usually move on."
  - "5. Use StopNCII.org if you possess the video/image and fear upload on Meta/social platforms."
  - "6. Report on cybercrime.gov.in and call 1930 (especially if you already paid any amount, to freeze the scammer's account)."
  - "7. Remember: Real police NEVER call on WhatsApp video or ask for money via UPI to delete a YouTube video."
answer_hi:
  - "1. एक रुपया भी न दें: पैसे देने से ब्लैकमेलर कभी नहीं रुकते, बल्कि वे और ज्यादा पैसे मांगते हैं (कई बार तो बाद में नकली 'साइबर पुलिस' या 'यूट्यूब अधिकारी' बनकर वीडियो हटाने के पैसे भी मांगते हैं)।"
  - "2. चैट या सबूत डिलीट न करें: धमकी देने वाले का नंबर, प्रोफाइल, कॉल लॉग, भेजी गई UPI आईडी/बैंक खाता और मैसेज के स्क्रीनशॉट सुरक्षित रखें।"
  - "3. अपने सोशल मीडिया अकाउंट तुरंत Private करें: Facebook और Instagram पर Friends/Followers लिस्ट छुपाएं (Only Me करें) और अनजान मैसेज रिक्वेस्ट बंद करें।"
  - "4. तुरंत ब्लॉक करें और बात बंद करें: ठग को जवाब न दें, न ही मिन्नतें करें — नंबर और आईडी हर जगह से ब्लॉक कर दें। जब उन्हें पता चलता है कि पैसे नहीं मिलेंगे, तो वे अक्सर पीछे हट जाते हैं।"
  - "5. अगर आपके पास वह फोटो/वीडियो है तो सोशल मीडिया पर अपलोड रोकने के लिए StopNCII.org की मदद लें।"
  - "6. cybercrime.gov.in पर शिकायत दर्ज करें और अगर डर में कुछ पैसे दे दिए हैं तो तुरंत 1930 पर कॉल करके रकम होल्ड करवाएं।"
  - "7. ध्यान रखें: असली पुलिस कभी WhatsApp पर वीडियो हटाने के नाम पर पैसे नहीं मांगती।"
