sample_queries:
  - "How do I report a cyber crime in Alwar?"
  - "Cybercrime.gov.in par complaint kaise file kare"
  - "साइबर क्राइम की शिकायत कहां और कैसे करें"
  - "1930 helpline steps"
answer_en:
  - "Step 1 — Financial Fraud (Call 1930 Immediately): If money was lost recently, dial 1930 (24x7) right away with your bank name, amount, date/time, and UTR/Transaction ID. If 1930 is busy, dial 112 or submit directly on cybercrime.gov.in immediately."
  - "Step 2 — Online Complaint on cybercrime.gov.in: Visit https://cybercrime.gov.in -> Click 'File a Complaint' -> Accept terms -> Choose 'Report Other Cyber Crime' (or 'Report Cyber Crime Related to Women/Children')."
  - "Step 3 — Login via Mobile OTP: Select state 'Rajasthan', district 'Alwar', enter your mobile number and verify with OTP."
  - "Step 4 — Fill Incident & Suspect Details: Write clearly what happened, enter transaction details (UTR, bank, amount), and attach screenshots/bank statement."
  - "Step 5 — Save Acknowledgement Number: After submitting, download the PDF and save the 14-digit Acknowledgement Number safely."
  - "Step 6 — Follow Up at Nearest Alwar Thana / Cyber Cell: For large losses, physical threats, or FIR conversion, visit your local Alwar Police Station (use our Thana Finder) or Alwar Cyber Cell with printed complaint PDF, ID proof, and bank-stamped statement."
answer_hi:
  - "कदम 1 — पैसों की ठगी में तुरंत 1930 पर कॉल करें: 24x7 हेल्पलाइन 1930 पर कॉल करके बैंक नाम, कटी रकम, समय और 12 अंकों का UTR नंबर बताएं। अगर लाइन व्यस्त मिले तो तुरंत खुद cybercrime.gov.in पर ऑनलाइन दर्ज करें या 112 पर कॉल करें।"
  - "कदम 2 — पोर्टल खोलें: https://cybercrime.gov.in पर जाएं -> 'File a Complaint' दबाएं -> 'Report Other Cyber Crime' (या महिला/बच्चों के मामले में संबंधित विकल्प) चुनें।"
  - "कदम 3 — OTP से लॉगिन करें: राज्य 'Rajasthan', जिला 'Alwar' चुनें और अपना मोबाइल नंबर डालकर OTP से लॉगिन करें।"
  - "कदम 4 — घटना और सबूत भरें: पूरी बात आसान शब्दों में लिखें, ट्रांज़ैक्शन की जानकारी (UTR, तारीख, रकम) भरें और स्क्रीनशॉट अपलोड करें।"
  - "कदम 5 — रसीद नंबर संभालें: सबमिट करने के बाद मिलने वाला 14 अंकों का Acknowledgement Number और PDF कॉपी सुरक्षित रखें।"
  - "कदम 6 — नजदीकी अलवर थाने / साइबर सेल जाएं: बड़ी रकम या गंभीर मामले में शिकायत की प्रिंट कॉपी, आधार कार्ड और बैंक की मुहर लगा स्टेटमेंट लेकर अपने नजदीकी थाने (Thana Finder से खोजें) या अलवर साइबर सेल जाएं।"
