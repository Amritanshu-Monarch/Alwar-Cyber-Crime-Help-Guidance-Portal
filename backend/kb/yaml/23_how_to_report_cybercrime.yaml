title_en: "How to Report Any Cybercrime (1930, cybercrime.gov.in & Local Thana)"
title_hi: "साइबर अपराध की शिकायत कैसे दर्ज करें (1930, पोर्टल और थाना)"
summary_en: "Complete step-by-step guide to reporting cyber fraud or online crime via Helpline 1930, cybercrime.gov.in, or your nearest Alwar Police Station / Cyber Cell."
summary_hi: "1930 हेल्पलाइन, cybercrime.gov.in पोर्टल और नजदीकी अलवर थाने या साइबर सेल में साइबर ठगी की शिकायत दर्ज करने का आसान तरीका।"
