id: "gmail_google_hacked"
category: "social_media"
urgency: "high"
title_en: "Gmail / Google Account Hacked — Official Recovery Steps"
title_hi: "Gmail / Google अकाउंट हैक होने पर सुरक्षित करने का तरीका"
summary_en: "Google account controls your Android phone, Contacts, Photos, and bank alerts. Recover it quickly via Google's official recovery flow."
summary_hi: "आपका Gmail/Google अकाउंट आपके पूरे Android फोन, फोटो और बैंक ईमेल से जुड़ा होता है। तुरंत आधिकारिक रिकवरी पेज से इसे वापस पाएं।"
keywords_en:
  - "gmail hacked"
  - "google account hacked"
  - "recover gmail account"
  - "someone logged into my gmail"
  - "google password changed"
keywords_hi:
  - "जीमेल हैक हो गया"
  - "गूगल अकाउंट हैक"
  - "जीमेल कैसे वापस लाएं"
keywords_hinglish:
  - "gmail hack ho gaya"
  - "google account recover kaise kare"
  - "mera gmail kisi aur ne login kar liya"
  - "gmail password change kar diya kisi ne"
sample_queries:
  - "Someone hacked my Gmail and changed my recovery phone"
  - "Gmail hack ho gaya kaise wapas laye"
  - "मेरा जीमेल अकाउंट हैक हो गया है क्या करूं"
  - "Unknown login alert on my Google account"
answer_en:
  - "1. Go straight to Google's official recovery page: https://accounts.google.com/signin/recovery from a device and Wi-Fi/network you normally use."
  - "2. Answer as many recovery questions accurately as possible (previous password you remember, recovery email/phone, device prompt)."
  - "3. Once inside, visit Google Account -> Security -> Your devices -> Manage all devices -> Sign out EVERY device you do not recognize."
  - "4. Immediately change your Google password (choose a unique 12+ character password not used anywhere else)."
  - "5. Turn ON 2-Step Verification (2SV) and check Recovery Phone & Recovery Email to ensure the hacker didn't replace them."
  - "6. Open Gmail Settings -> Filters and Blocked Addresses AND Forwarding and POP/IMAP — delete any unknown auto-forwarding rule the hacker might have added."
  - "7. Check Google Account -> Security -> Third-party apps with account access and remove suspicious apps."
  - "8. Escalate to Google India Grievance Officer: For unresolved Google, YouTube, or GPay account compromise or policy violations, file directly at https://www.google.com/intl/en_in/contact/grievance-officer.html. If unresolved within 15 days, file an appeal with the Government of India Grievance Appellate Committee (GAC) at https://gac.gov.in/ within 30 days."
answer_hi:
  - "1. तुरंत Google के आधिकारिक रिकवरी पेज https://accounts.google.com/signin/recovery पर जाएं (कोशिश करें कि उसी फोन और नेटवर्क से खोलें जिस पर आप रोज इस्तेमाल करते हैं)।"
  - "2. पूछे गए सवालों के सही जवाब दें (जैसे पिछला याद पासवर्ड, पुराना रिकवरी नंबर/ईमेल आदि)।"
  - "3. लॉगिन मिलते ही Google Account -> Security -> Your devices में जाकर हर अनजान फोन या कंप्यूटर से तुरंत Sign out करें।"
  - "4. तुरंत नया, मजबूत और अलग पासवर्ड सेट करें।"
  - "5. 2-Step Verification चालू करें और जांचें कि Recovery Phone और Recovery Email में सिर्फ आपका ही नंबर व ईमेल हो (अगर हैकर का नंबर जुड़ा हो तो तुरंत हटाएं)।"
  - "6. Gmail की Settings में 'Forwarding and POP/IMAP' और 'Filters' जरूर जांचें — अगर हैकर ने आपके ईमेल कहीं फॉरवर्ड किए हैं तो उसे तुरंत डिलीट करें।"
  - "7. Security में जाकर संदिग्ध Third-party ऐप्स की परमिशन भी हटा दें।"
  - "8. Google India Grievance Officer को शिकायत: यदि Google, YouTube या GPay खाते की हैकिंग हल न हो, तो सीधे Grievance Officer पोर्टल https://www.google.com/intl/en_in/contact/grievance-officer.html पर शिकायत दर्ज करें। 15 दिन में राहत न मिलने पर भारत सरकार के GAC पोर्टल https://gac.gov.in/ पर अपील करें।"
