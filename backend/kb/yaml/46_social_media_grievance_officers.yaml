sample_queries:
  - "How to report fake / hacked / impersonating social media accounts to Grievance Officer?"
  - "Social media grievance officer India direct reporting links"
  - "What should my social media complaint include?"
  - "If social media platform does not respond within 15 days what to do"
  - "GAC portal appeal process for fake or hacked account"
  - "फेसबुक या इंस्टाग्राम की फेक आईडी को Grievance Officer को कैसे रिपोर्ट करें"
answer_en:
  - "1. Report First to the Platform's Grievance Officer: Under IT Rules 2021, all major social media platforms maintain designated India Grievance Officers to handle hacked accounts, fake/impersonating profiles, non-consensual imagery, and account takedowns."
  - "2. Direct India Grievance Officer Links: (a) WhatsApp India: https://www.whatsapp.com/contact/forms/1534459096974129 | (b) Facebook & Instagram (Meta): https://help.meta.com/requests/1371776380779082/ | (c) X (Twitter) India: https://help.x.com/en/forms/report-to-grievance-officer-india | (d) Google / YouTube / GPay: https://www.google.com/intl/en_in/contact/grievance-officer.html | (e) Telegram: https://telegram.org/support | (f) Snapchat: https://help.snapchat.com/."
  - "3. What Your Complaint Must Include (Mandatory Checklist): (a) Clear incident description specifying whether it is a fake account, hacked account, impersonation, or photo misuse; (b) Clear, uncropped full-screen screenshots; (c) Exact Profile URL link, Username, and User ID of the fake/hacked account; (d) Your real name, contact email address, and mobile phone number for verification."
  - "4. 15-Day Resolution Rule & GAC Appeal: The platform's Grievance Officer is legally required to acknowledge your complaint within 24 hours and resolve it within 15 days. If the platform fails to reply within 15 days, or provides an unsatisfactory decision, file an appeal on the Government of India Grievance Appellate Committee (GAC) Portal at https://gac.gov.in/ within 30 calendar days."
  - "5. Police & Cyber Crime Reporting: For criminal offences such as extortion, fraud, threats, blackmail, or sexual imagery, report immediately to National Cyber Crime Portal at https://cybercrime.gov.in, call 1930, or visit your nearest Police Thana / Cyber Cell with your evidence."
answer_hi:
  - "1. सबसे पहले संबंधित प्लेटफॉर्म के Grievance Officer को रिपोर्ट करें: IT Rules 2021 के तहत सभी प्रमुख सोशल मीडिया कंपनियों के भारत में Grievance Officer होते हैं, जो हैक अकाउंट, नकली प्रोफाइल (Impersonation) और आपत्तिजनक फोटो हटाने का काम करते हैं।"
  - "2. प्रमुख सोशल मीडिया Grievance Officer के सीधे लिंक: (क) WhatsApp इंडिया: https://www.whatsapp.com/contact/forms/1534459096974129 | (ख) Facebook व Instagram (Meta): https://help.meta.com/requests/1371776380779082/ | (ग) X (Twitter) इंडिया: https://help.x.com/en/forms/report-to-grievance-officer-india | (घ) Google / YouTube / GPay: https://www.google.com/intl/en_in/contact/grievance-officer.html | (ङ) Telegram: https://telegram.org/support | (च) Snapchat: https://help.snapchat.com/."
  - "3. आपकी शिकायत में क्या-क्या होना आवश्यक है (चेकलिस्ट): (क) घटना का साफ विवरण (नकली प्रोफाइल, हैक अकाउंट, नाम/फोटो का दुरुपयोग); (ख) स्पष्ट स्क्रीनशॉट; (ग) नकली/हैक अकाउंट का पूरा प्रोफाइल लिंक (URL), यूज़रनेम व आईडी; (घ) आपका असली नाम, ईमेल आईडी व संपर्क मोबाइल नंबर।"
  - "4. 15 दिन की समय सीमा व GAC पोर्टल अपील: Grievance Officer को 24 घंटे में शिकायत की पावती और 15 दिन में समाधान देना अनिवार्य है। यदि 15 दिन में कोई जवाब न मिले या समाधान असंतोषजनक हो, तो 30 दिन के भीतर भारत सरकार की Grievance Appellate Committee (GAC) पोर्टल https://gac.gov.in/ पर अपील दर्ज करें।"
  - "5. साइबर पुलिस रिपोर्ट: यदि मामले में पैसों की ठगी, ब्लैकमेल, अश्लील सामग्री या धमकी शामिल है, तो तुरंत 1930 पर कॉल करें और https://cybercrime.gov.in या नजदीकी थाने/साइबर सेल में शिकायत दर्ज करें।"
