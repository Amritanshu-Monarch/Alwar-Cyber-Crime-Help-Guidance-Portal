id: "wrong_upi_transfer"
category: "financial_fraud"
urgency: "high"
title_en: "Sent Money to Wrong UPI ID or Wrong Bank Account by Mistake"
title_hi: "गलती से दूसरे के UPI या बैंक खाते में पैसे चले गए"
summary_en: "An accidental transfer by you is not always cyber fraud, but you must act quickly with your bank and NPCI dispute resolution."
summary_hi: "अगर आपसे खुद गलती से किसी गलत नंबर या खाते में पैसे ट्रांसफर हो गए हैं, तो तुरंत बैंक और UPI ऐप में शिकायत दर्ज करें।"
keywords_en:
  - "wrong upi transfer"
  - "sent money to wrong account"
  - "mistakenly transferred money"
  - "wrong phonepe payment"
  - "refund wrong upi payment"
keywords_hi:
  - "गलती से दूसरे को पैसे भेज दिए"
  - "गलत खाते में पैसे चले गए"
  - "गलत नंबर पर यूपीआई हो गया"
keywords_hinglish:
  - "galti se galat upi par paise bhej diye"
  - "wrong account me paise transfer ho gaye"
  - "dusre ke number par phonepe ho gaya"
  - "galti se bheja paisa wapas kaise aayega"
sample_queries:
  - "I accidentally sent 2000 to the wrong UPI ID"
  - "Galti se kisi aur ke number par PhonePe ho gaya"
  - "गलती से गलत बैंक खाते में पैसे ट्रांसफर हो गए"
  - "How to reverse wrong UPI transaction"
answer_en:
  - "Note the exact UTR / Transaction ID, date, time, amount, and the wrong UPI ID / account number."
  - "First raise a dispute inside your UPI app (PhonePe / GPay / Paytm / BHIM) under 'Transaction History -> Need Help / Wrong Transfer'."
  - "Visit your bank branch immediately with a written application and transaction screenshot; under RBI guidelines, your bank can send a formal reversal request to the receiver's bank."
  - "You can also raise a complaint on the NPCI UPI Dispute Redressal section (via official npci.org.in portal — verify URL carefully)."
  - "Remember: the receiver's bank cannot debit their account without their consent unless there is fraud or court order; polite communication through your bank helps."
  - "If the recipient refuses to return a large accidental transfer or tricked you into sending it, report the matter to your local Police Station / 1930."
answer_hi:
  - "सबसे पहले ट्रांज़ैक्शन का 12 अंकों का UTR नंबर, तारीख, समय, रकम और गलत UPI/खाता नंबर नोट करें।"
  - "अपने UPI ऐप (PhonePe / GPay / Paytm / BHIM) में उस पेमेंट पर जाकर 'Help / Raise Dispute / Wrong Transfer' विकल्प से तुरंत शिकायत दर्ज करें।"
  - "तुरंत अपनी बैंक शाखा में जाकर ट्रांज़ैक्शन स्क्रीनशॉट के साथ लिखित आवेदन दें ताकि आपका बैंक सामने वाले के बैंक को पैसे वापसी (Reversal Request) का संदेश भेज सके।"
  - "आधिकारिक NPCI पोर्टल (npci.org.in) के UPI शिकायत सेक्शन में भी गलत लेन-देन की शिकायत की जा सकती है।"
  - "ध्यान रखें: केवल गलती होने पर सामने वाला बैंक बिना खाताधारक की मंजूरी के पैसे वापस नहीं काट सकता, इसलिए बैंक के जरिए औपचारिक अनुरोध जरूरी है।"
  - "यदि किसी ने धोखे से आपसे गलत नंबर पर पैसे डलवाए हैं या बड़ी रकम लौटाने से साफ मना कर रहा है, तो स्थानीय पुलिस थाने या 1930 पर सूचित करें।"
