id: "remote_access_scam"
category: "device_malware"
urgency: "emergency"
title_en: "Screen Sharing / Remote Access App Fraud (AnyDesk / TeamViewer)"
title_hi: "स्क्रीन शेयरिंग ऐप (AnyDesk / TeamViewer) द्वारा ठगी"
summary_en: "Fraudsters ask you to install AnyDesk, QuickSupport, or share WhatsApp screen to 'help' with KYC or refund, then steal money."
summary_hi: "ठग KYC या रिफंड के नाम पर AnyDesk, TeamViewer या WhatsApp स्क्रीन शेयर कराते हैं। तुरंत ऐप हटाएं और बैंक बंद कराएं।"
keywords_en:
  - "anydesk scam"
  - "teamviewer fraud"
  - "quicksupport scam"
  - "screen sharing fraud"
  - "remote access app scam"
  - "whatsapp screen share fraud"
keywords_hi:
  - "एनीडेस्क फ्रॉड"
  - "स्क्रीन शेयर करके ठगी"
  - "टीमव्यूअर स्कैम"
  - "रिमोट ऐप धोखाधड़ी"
keywords_hinglish:
  - "anydesk download karwake paise nikal liye"
  - "screen share karwa kar fraud ho gaya"
  - "teamviewer quicksupport scam"
  - "whatsapp screen share se paise kat gaye"
sample_queries:
  - "Someone made me install AnyDesk and stole money"
  - "Screen share karke mere account se paise nikal liye"
  - "AnyDesk या TeamViewer से ठगी हो गई क्या करूं"
  - "Customer care told me to share my screen on WhatsApp"
answer_en:
  - "Disconnect mobile data / Wi-Fi immediately and close AnyDesk / TeamViewer / QuickSupport."
  - "Uninstall the remote access app immediately from Settings -> Apps."
  - "Call 1930 right away from another phone if any money was deducted."
  - "Call your bank's official helpline to freeze internet banking, mobile banking, and cards."
  - "Change all banking passwords, UPI PINs, and email passwords from a clean device."
  - "Remember: NO real bank, government office, or customer care ever asks you to share your phone screen or install remote-control apps."
answer_hi:
  - "तुरंत मोबाइल डेटा और Wi-Fi बंद करें ताकि ठग आपकी स्क्रीन देखना बंद करे।"
  - "फोन की Settings -> Apps में जाकर AnyDesk / TeamViewer / QuickSupport जैसे स्क्रीन शेयरिंग ऐप को तुरंत Uninstall करें।"
  - "अगर पैसे कट गए हैं तो किसी दूसरे फोन से तुरंत 1930 पर कॉल करें।"
  - "अपने बैंक के असली हेल्पलाइन नंबर पर कॉल करके नेटबैंकिंग, मोबाइल बैंकिंग और कार्ड अस्थायी रूप से बंद करवाएं।"
  - "साफ डिवाइस से अपने बैंक पासवर्ड, UPI PIN और ईमेल पासवर्ड बदलें।"
  - "याद रखें: कोई भी असली बैंक या सरकारी कर्मचारी कभी भी स्क्रीन शेयर करने या रिमोट ऐप डाउनलोड करने के लिए नहीं कहता।"
