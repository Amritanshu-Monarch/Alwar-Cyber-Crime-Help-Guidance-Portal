id: "whatsapp_impersonation"
category: "social_media"
urgency: "high"
title_en: "Fake WhatsApp Account Using My Photo / Name (Impersonation)"
title_hi: "मेरी फोटो लगाकर नकली WhatsApp नंबर से दोस्तों से पैसे मांगना"
summary_en: "Scammers put your profile photo on an unknown number and message friends/bosses for urgent money or gift cards."
summary_hi: "ठग किसी अनजान नंबर पर आपकी फोटो लगाकर आपके जानकारों से इमरजेंसी बताकर पैसे मांगते हैं। तुरंत सावधान करें और रिपोर्ट करें।"
keywords_en:
  - "fake whatsapp account"
  - "whatsapp dp scam"
  - "impersonating me on whatsapp"
  - "someone using my photo on whatsapp"
  - "boss whatsapp scam"
keywords_hi:
  - "मेरी फोटो लगाकर फर्जी व्हाट्सएप"
  - "नकली व्हाट्सएप डीपी"
  - "मेरे नाम से पैसे मांग रहा है"
keywords_hinglish:
  - "meri photo laga kar whatsapp par paise mang raha hai"
  - "fake whatsapp number se scam"
  - "dp chura kar fraud kar raha hai"
  - "mere naam se fake whatsapp banaya hai"
sample_queries:
  - "Someone is using my photo on an unknown WhatsApp number and asking friends for money"
  - "Meri DP lagakar fake WhatsApp se paise mang rahe hain"
  - "किसी ने मेरी फोटो लगाकर फर्जी व्हाट्सएप बनाया है"
  - "Fake WhatsApp impersonation how to stop"
answer_en:
  - "Post a clear alert immediately on your real WhatsApp Status, family groups, Facebook, and Instagram: 'Warning: An unknown number (+XX...) is using my photo to ask for money. Please DO NOT send money and report/block that number.'"
  - "Ask your contacts who received messages to tap 'Report' and 'Block' directly inside that WhatsApp chat (multiple user reports trigger automated suspension)."
  - "Take screenshots of the fake WhatsApp profile, phone number, and chat messages asking for money."
  - "Restrict your own WhatsApp Profile Photo visibility: Settings -> Privacy -> Profile Photo -> set to 'My Contacts'."
  - "Submit Official Grievance to WhatsApp India: File a formal report at https://www.whatsapp.com/contact/forms/1534459096974129 with screenshots, the impersonating phone number, and evidence of identity misuse. If unaddressed in 15 days, appeal to Government of India GAC at https://gac.gov.in/."
  - "File an impersonation report on cybercrime.gov.in with screenshots and the fraudster's phone number/UPI ID."
answer_hi:
  - "तुरंत अपने असली WhatsApp स्टेटस, परिवार के ग्रुप और सोशल मीडिया पर सूचना डालें: 'सावधान! किसी अनजान नंबर से मेरी फोटो लगाकर पैसे मांगे जा रहे हैं। कोई भी पैसा न भेजें और उस नंबर को तुरंत ब्लॉक व रिपोर्ट करें।'"
  - "जिन परिचितों को मैसेज आया है, उनसे कहें कि उस चैट में जाकर 'Report & Block' दबाएं (अधिक रिपोर्ट होने पर WhatsApp वह नंबर बंद कर देता है)।"
  - "नकली नंबर की प्रोफाइल, फोटो और पैसे मांगने वाली चैट के स्क्रीनशॉट संभाल कर रखें।"
  - "अपनी असली WhatsApp सेटिंग बदलें: Settings -> Privacy -> Profile Photo -> 'My Contacts' चुनें ताकि अनजान लोग आपकी फोटो न देख सकें।"
  - "WhatsApp इंडिया Grievance Officer को आधिकारिक शिकायत भेजें: https://www.whatsapp.com/contact/forms/1534459096974129 पर नकली नंबर और स्क्रीनशॉट देकर अकाउंट बंद कराएं। 15 दिन में कार्रवाई न होने पर https://gac.gov.in/ (GAC) पर अपील करें।"
  - "स्क्रीनशॉट और ठग के नंबर/UPI ID के साथ cybercrime.gov.in पर शिकायत दर्ज करें।"
