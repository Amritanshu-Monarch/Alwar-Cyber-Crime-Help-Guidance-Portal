id: "x_twitter_hacked"
category: "social_media"
urgency: "high"
title_en: "X (Twitter) Account Hacked — Official Recovery Steps"
title_hi: "X (Twitter) अकाउंट हैक होने पर वापस पाने का तरीका"
summary_en: "Password changed or strange crypto posts appearing from your X/Twitter account? Reset password, revoke suspicious connected apps, and contact X Help."
summary_hi: "अगर आपका X (ट्विटर) अकाउंट हैक हो गया है या उससे अजीब पोस्ट हो रहे हैं, तो पासवर्ड रीसेट करें, थर्ड-पार्टी ऐप्स हटाएं और X सहायता फॉर्म भरें।"
keywords_en:
  - "twitter hacked"
  - "x account hacked"
  - "recover x account"
  - "twitter account compromised"
keywords_hi:
  - "ट्विटर हैक हो गया"
  - "एक्स अकाउंट हैक"
  - "ट्विटर रिकवर कैसे करें"
keywords_hinglish:
  - "twitter hack ho gaya"
  - "x account hack ho gaya"
  - "twitter recover kaise kare"
sample_queries:
  - "My X Twitter account got hacked and is posting spam"
  - "Twitter hack ho gaya hai wapas kaise laye"
  - "मेरा एक्स (ट्विटर) अकाउंट हैक हो गया है"
answer_en:
  - "1. Try Password Reset first: On X login, click 'Forgot password?' using your registered email or phone number."
  - "2. If hacker changed your email/phone: Open the security alert email from X saying your email was changed and follow the revert link, OR submit an official Compromised Account ticket at https://help.x.com/."
  - "3. Check Connected Apps immediately: Once logged in, go to Settings and privacy -> Security and account access -> Apps and sessions -> Connected apps -> revoke any app you do not recognize."
  - "4. Log out other sessions under 'Sessions' and enable Two-Factor Authentication (Authenticator App recommended)."
  - "5. Delete unauthorized spam posts and warn your followers."
  - "6. Report at cybercrime.gov.in if the hacker is harassing, impersonating, or scamming others."
  - "7. Escalate to X (Twitter) India Grievance Officer: If automated recovery fails, file directly at https://help.x.com/en/forms/report-to-grievance-officer-india. If unresolved within 15 days, file an appeal with Government of India GAC at https://gac.gov.in/ within 30 days."
answer_hi:
  - "1. सबसे पहले पासवर्ड रीसेट आजमाएं: X लॉगिन पर 'Forgot password?' दबाकर अपने पंजीकृत ईमेल या नंबर से पासवर्ड बदलने की कोशिश करें।"
  - "2. अगर हैकर ने ईमेल/नंबर बदल दिया है: अपने पुराने ईमेल में X का सुरक्षा अलर्ट देखें, या आधिकारिक सहायता केंद्र https://help.x.com/ पर 'Hacked / Compromised Account' फॉर्म भरें।"
  - "3. अनजान ऐप्स और सेशन हटाएं: लॉगिन होते ही Settings and privacy -> Security and account access -> Apps and sessions में जाकर हर अनजान ऐप की परमिशन हटाएं और बाकी सेशन लॉगआउट करें।"
  - "4. Two-Factor Authentication (2FA) चालू करें और नया मजबूत पासवर्ड सेट करें।"
  - "5. हैकर द्वारा की गई फर्जी पोस्ट डिलीट करें और फॉलोअर्स को सावधान करें।"
  - "6. यदि कोई ठगी या बदनामी की गई है, तो cybercrime.gov.in पर शिकायत दर्ज करें।"
  - "7. X (Twitter) India Grievance Officer को शिकायत: सामान्य सहायता से समाधान न होने पर सीधे Grievance Officer फॉर्म https://help.x.com/en/forms/report-to-grievance-officer-india पर शिकायत दर्ज करें। 15 दिन में राहत न मिलने पर भारत सरकार के GAC पोर्टल https://gac.gov.in/ पर अपील करें।"
