id: "otp_bank_fraud"
category: "financial_fraud"
urgency: "emergency"
title_en: "OTP Scam / Fake Bank Call Fraud"
title_hi: "OTP बता देने या फर्जी बैंक कॉल से हुई ठगी"
summary_en: "If you shared an OTP or clicked a fake bank link and lost money, act within minutes to freeze funds and block your bank channels."
summary_hi: "अगर गलती से किसी को OTP बता दिया है और पैसे कट गए हैं, तो तुरंत बैंक खाता व कार्ड ब्लॉक कराएं और 1930 पर कॉल करें।"
keywords_en:
  - "otp scam"
  - "shared otp by mistake"
  - "fake bank call"
  - "otp fraud"
  - "bank manager fraud call"
  - "kyc otp fraud"
keywords_hi:
  - "ओटीपी फ्रॉड"
  - "गलती से ओटीपी बता दिया"
  - "फर्जी बैंक कॉल"
  - "ओटीपी शेयर हो गया"
  - "बैंक से फोन आया था"
keywords_hinglish:
  - "otp bata diya"
  - "galti se otp share ho gaya"
  - "bank se fake call aaya tha"
  - "otp dene ke baad paise kat gaye"
  - "kisi ko otp de diya kya karu"
  - "otp scam ho gaya"
sample_queries:
  - "Galti se kisi ko OTP bata diya ab paise kat gaye"
  - "I accidentally shared my bank OTP on a fake call"
  - "मेरा ओटीपी गलती से किसी को चला गया क्या करूं"
  - "Fake bank officer called and took OTP"
  - "OTP batane ke baad account khali ho gaya"
answer_en:
  - "Call 1930 right away to report the fraud and trigger fund freezing across banks."
  - "Call your bank's official helpline immediately (check bank passbook or card back — never search Google) and ask to block your debit/credit card and internet banking."
  - "Even if money has NOT been debited yet after sharing OTP, immediately change your netbanking password, mobile banking PIN, and UPI PIN."
  - "Block the fraudster's number and do NOT share any second OTP even if they call back saying 'to cancel/refund the transaction'."
  - "Take screenshots of the SMS/OTP alert, call history, and bank debit messages."
  - "Submit your formal complaint on cybercrime.gov.in and note down the Acknowledgement Number."
answer_hi:
  - "तुरंत 1930 पर कॉल करें ताकि समय रहते ठग के खाते में पैसा फ्रीज़ किया जा सके।"
  - "अपने बैंक के असली कस्टमर केयर (पासबुक या कार्ड के पीछे लिखा नंबर — गूगल से नंबर न खोजें) पर कॉल करके तुरंत कार्ड और नेटबैंकिंग ब्लॉक करवाएं।"
  - "अगर OTP बताने के बाद अभी तक पैसे नहीं कटे हैं, तो भी तुरंत अपना नेटबैंकिंग पासवर्ड, मोबाइल बैंकिंग PIN और UPI PIN बदल दें।"
  - "ठग दोबारा फोन करके कह सकता है कि 'पैसा वापस करने के लिए एक और OTP बताएं' — बिल्कुल भरोसा न करें और नंबर ब्लॉक करें।"
  - "कॉल रिकॉर्ड, SMS अलर्ट और बैंक मैसेज के स्क्रीनशॉट सुरक्षित रखें।"
  - "cybercrime.gov.in पर लिखित शिकायत दर्ज करें और रसीद नंबर संभाल कर रखें।"
