id: "facebook_hacked"
category: "social_media"
urgency: "high"
title_en: "Facebook Account Hacked — Official Recovery Steps"
title_hi: "Facebook अकाउंट हैक होने पर रिकवर करने के कदम"
summary_en: "Lost access to your Facebook or hacker changed email/password? Use Facebook's official hacked-account flow and secure your sessions."
summary_hi: "अगर आपका फेसबुक हैक हो गया है या पासवर्ड-ईमेल बदल दिया गया है, तो केवल आधिकारिक फेसबुक रिकवरी पेज से वापस पाएं।"
keywords_en:
  - "facebook hacked"
  - "recover hacked facebook"
  - "fb account hacked"
  - "hacker changed facebook email and password"
  - "facebook compromised"
keywords_hi:
  - "फेसबुक हैक हो गया"
  - "फेसबुक अकाउंट वापस कैसे लाएं"
  - "एफबी आईडी हैक"
keywords_hinglish:
  - "facebook hack ho gaya"
  - "fb account recover kaise kare"
  - "facebook ka password aur email badal diya"
  - "mera fb kisi ne hack kar liya"
sample_queries:
  - "My Facebook account was hacked and email was changed"
  - "Facebook hack ho gaya kaise recover kare"
  - "मेरा फेसबुक अकाउंट हैक हो गया है क्या करूं"
  - "Someone logged into my FB and is posting scam links"
answer_en:
  - "1. Use ONLY the official recovery page: Open https://www.facebook.com/hacked from a phone/browser you have previously used to log into Facebook."
  - "2. Select 'My account is compromised', search your account by phone/email/username, and follow prompts. If the hacker changed your email, look for Facebook's security email in your inbox saying 'Your email was removed — Click here to secure your account'."
  - "3. Complete Official Identity Verification: If prompted because password/email/phone were all changed, follow 'No longer have access to these?' and upload a clear photo of your government ID as requested by Facebook's official flow."
  - "4. Log Out Unknown Devices: Once recovered, go to Settings -> Accounts Center -> Password and security -> Where you're logged in -> Log out of all unknown devices."
  - "5. Enable Two-Factor Authentication (2FA) via Authenticator App or SMS, and check Settings -> Apps and Websites to remove unknown third-party apps."
  - "6. Escalate to Meta (Facebook) Grievance Officer: If Facebook's automated recovery fails to restore access or remove an impersonating profile, file directly with the Meta India Grievance Officer at https://help.meta.com/requests/1371776380779082/. If unresolved within 15 days, appeal to Government of India GAC at https://gac.gov.in/."
  - "7. Warn your Facebook friends not to click scam links or send money if the hacker messaged them."
  - "8. Report at cybercrime.gov.in and call 1930 if financial fraud, blackmail, or defamation occurred."
answer_hi:
  - "1. केवल आधिकारिक पेज खोलें: जिस फोन या ब्राउज़र से आप पहले फेसबुक चलाते थे, उससे https://www.facebook.com/hacked पर जाएं।"
  - "2. 'My account is compromised' चुनें और अपना नंबर/ईमेल/नाम खोजें। अगर हैकर ने आपका ईमेल बदला है, तो अपने पुराने ईमेल के इनबॉक्स में फेसबुक का अलर्ट मेल देखें — उसमें 'Secure your account' का लिंक आता है।"
  - "3. पहचान सत्यापन (ID Verification) करें: यदि फोन और ईमेल दोनों बदल दिए गए हैं, तो 'No longer have access to these?' चुनकर आधिकारिक प्रक्रिया के अनुसार अपना पहचान पत्र अपलोड करें।"
  - "4. अनजान डिवाइस हटाएं: अकाउंट वापस मिलते ही Settings -> Accounts Center -> Password and security -> Where you're logged in में जाकर हर अनजान डिवाइस से Log out करें।"
  - "5. Two-Factor Authentication (2FA) चालू करें और नया मजबूत पासवर्ड रखें। पुराने संदिग्ध ऐप्स (Apps and Websites) हटा दें।"
  - "6. Meta (Facebook) Grievance Officer को शिकायत: यदि ऑटोमेटेड रिकवरी से काम न बने, तो Meta Grievance Officer के डायरेक्ट फॉर्म https://help.meta.com/requests/1371776380779082/ पर शिकायत भेजें। 15 दिन में राहत न मिलने पर भारत सरकार के GAC पोर्टल https://gac.gov.in/ पर अपील करें।"
  - "7. अपने दोस्तों को बता दें कि आपके अकाउंट से आए किसी भी पैसे या लिंक के मैसेज पर भरोसा न करें।"
  - "8. अगर ठगी या बदनामी की गई है, तो 1930 व cybercrime.gov.in पर शिकायत दर्ज करें।"
