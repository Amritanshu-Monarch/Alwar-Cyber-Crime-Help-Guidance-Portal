id: "phone_lost_stolen"
category: "device_malware"
urgency: "emergency"
title_en: "Mobile Phone Lost or Stolen — Immediate Steps"
title_hi: "मोबाइल फोन गुम या चोरी होने पर तुरंत क्या करें"
summary_en: "Block your SIM, disable UPI/banking apps, track/lock your device, file a police missing/theft report, and block your IMEI."
summary_hi: "फोन चोरी या गुम होते ही सबसे पहले सिम कार्ड व UPI/बैंक बंद कराएं, पुलिस रिपोर्ट दर्ज करें और IMEI नंबर ब्लॉक कराएं।"
keywords_en:
  - "phone stolen"
  - "lost mobile phone"
  - "mobile chori ho gaya"
  - "block imei number"
  - "ceir block phone"
  - "sanchar saathi"
keywords_hi:
  - "मोबाइल चोरी हो गया"
  - "फोन गुम हो गया"
  - "सिम ब्लॉक कैसे करें"
  - "IMEI नंबर कैसे बंद करें"
keywords_hinglish:
  - "mera phone chori ho gaya"
  - "mobile gum ho gaya kya karu"
  - "sim aur upi kaise band karwaye"
  - "imei block kaise kare"
  - "chori hue phone se paise na nikle"
sample_queries:
  - "My mobile phone was stolen in Alwar bus stand"
  - "Phone chori ho gaya sim aur bank kaise bachaye"
  - "मेरा मोबाइल गुम हो गया है तुरंत क्या करूं"
  - "How to block stolen phone IMEI and UPI"
answer_en:
  - "1. Block your SIM immediately: Call your telecom operator (Jio / Airtel / Vi / BSNL) from another phone right away to block your SIM so thieves cannot receive bank or WhatsApp OTPs."
  - "2. Block UPI & Mobile Banking: Call your bank's official helpline immediately to temporarily freeze UPI, netbanking, and debit cards linked to that SIM."
  - "3. Lock/Erase remotely: From another phone or browser, log into Google Find My Device (Android) or Apple iCloud Find My (iPhone) to lock the screen or erase data."
  - "4. Change key passwords: Change your Gmail/Apple ID and social media passwords from a clean device."
  - "5. File Police Missing/Theft Report: Lodge a lost/stolen mobile report online (Rajasthan Police portal / e-Mitra / local Alwar Police Station) and keep the report copy/number."
  - "6. Block Phone IMEI via Government CEIR / Sanchar Saathi: Once you have the police report copy and replacement SIM, submit an IMEI block request on the official Government of India Sanchar Saathi / CEIR portal (verify exact .gov.in URL)."
  - "7. Call 1930 immediately if you notice any unauthorized bank debit after the theft."
answer_hi:
  - "1. तुरंत सिम ब्लॉक करवाएं: दूसरे फोन से अपनी टेलीकॉम कंपनी (Jio / Airtel / Vi / BSNL) को कॉल करके तुरंत पुराना सिम बंद करवाएं ताकि चोर को बैंक या WhatsApp का OTP न मिले।"
  - "2. UPI और बैंक ऐप बंद कराएं: अपने बैंक के आधिकारिक नंबर पर फोन करके मोबाइल बैंकिंग और UPI तुरंत अस्थायी रूप से बंद करवाएं।"
  - "3. फोन को दूर से लॉक करें: दूसरे फोन या कंप्यूटर पर Google Find My Device (Android) या iCloud (iPhone) में लॉगिन करके फोन को लॉक या डेटा साफ करें।"
  - "4. जरूरी पासवर्ड बदलें: दूसरे साफ डिवाइस से अपना Gmail और सोशल मीडिया पासवर्ड बदल दें।"
  - "5. पुलिस रिपोर्ट दर्ज करें: नजदीकी अलवर थाने या राजस्थान पुलिस ऑनलाइन पोर्टल / ई-मित्र के जरिए मोबाइल गुम/चोरी की रिपोर्ट दर्ज करें और रसीद नंबर लें।"
  - "6. IMEI नंबर ब्लॉक करवाएं: पुलिस रिपोर्ट और नया डुप्लीकेट सिम मिलने के बाद भारत सरकार के आधिकारिक संचार साथी / CEIR (.gov.in) पोर्टल पर जाकर फोन का IMEI नंबर ब्लॉक करें।"
  - "7. अगर फोन चोरी के बाद खाते से पैसे कटे हों, तो तुरंत 1930 पर कॉल करें।"
