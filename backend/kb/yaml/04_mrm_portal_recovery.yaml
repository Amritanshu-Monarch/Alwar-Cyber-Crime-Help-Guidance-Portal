sample_queries:
  - "What is MRM portal and how to get lost money back?"
  - "MRM portal par refund ke liye apply kaise kare"
  - "मेरे ठगी के पैसे बैंक में होल्ड हैं वापस कैसे मिलेंगे"
  - "Documents needed for MRM portal refund"
  - "1930 complaint ke baad hold money release process"
answer_en:
  - "What it is for: MRM (Money Refund Mechanism) assists victims whose stolen funds were successfully placed on hold/lien in suspect bank accounts after a 1930/NCRP complaint."
  - "Who can use it: Citizens who already have an active NCRP / 1930 Acknowledgement Number and confirmation that part or all of the fraudulent money is frozen/put on hold."
  - "Documents needed: NCRP Acknowledgement Number, bank passbook/statement showing the debit, Aadhaar/PAN ID, and court/police bond or application if required."
  - "Step 1: Verify your complaint on cybercrime.gov.in and confirm with the investigating Thana / Cyber Cell that money is on hold."
  - "Step 2: Open the official MRM Portal (see portal card below — verify exact URL before submitting any documents) or visit Alwar Cyber Cell / your Thana."
  - "Step 3: Submit your complaint number, bank details, and verification documents."
  - "Step 4: Track the order/refund process through the court/Lok Adalat or bank nodal officer as directed by police."
answer_hi:
  - "यह किस लिए है: MRM (मनी रिफंड मैकेनिज्म) पोर्टल का उपयोग 1930 / NCRP शिकायत के बाद ठग के खाते में होल्ड/फ्रीज़ की गई रकम को पीड़ित को वापस दिलाने की प्रक्रिया में किया जाता है।"
  - "कौन उपयोग कर सकता है: वे पीड़ित जिनकी शिकायत 1930 या cybercrime.gov.in पर दर्ज हो चुकी है और बैंक में कुछ या पूरी रकम होल्ड हो चुकी है।"
  - "जरूरी दस्तावेज़: NCRP Acknowledgement नंबर, बैंक स्टेटमेंट/पासबुक (पैसे कटने की एंट्री सहित), आधार/पैन कार्ड, तथा पुलिस/कोर्ट द्वारा मांगा गया आवेदन या बॉन्ड।"
  - "कदम 1: cybercrime.gov.in पर अपनी शिकायत का स्टेटस देखें और संबंधित थाने/साइबर सेल से कन्फर्म करें कि कितनी रकम होल्ड हुई है।"
  - "कदम 2: आधिकारिक MRM पोर्टल पर जाएं (नीचे दिए पोर्टल कार्ड में लिंक की सत्यता जांचें) या अलवर साइबर सेल / अपने थाने से संपर्क करें।"
  - "कदम 3: मांगे गए दस्तावेज़ और शिकायत संख्या सही-सही जमा करें।"
  - "कदम 4: पुलिस व बैंक के निर्देशानुसार कोर्ट/लोक अदालत आदेश या रिफंड प्रक्रिया पूरी होने पर रकम आपके खाते में आती है।"
