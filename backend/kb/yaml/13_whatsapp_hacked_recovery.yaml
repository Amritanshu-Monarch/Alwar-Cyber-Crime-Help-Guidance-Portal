id: "whatsapp_hacked"
category: "social_media"
urgency: "high"
title_en: "WhatsApp Account Hacked — Official Recovery Steps"
title_hi: "WhatsApp अकाउंट हैक होने पर वापस पाने के कदम"
summary_en: "Logged out of WhatsApp or someone is messaging your contacts? Re-register with SMS OTP, remove linked devices, enable 2-step PIN, and warn contacts."
summary_hi: "अगर आपका WhatsApp अचानक बंद हो गया या कोई आपके नंबर से दोस्तों को पैसे मांग रहा है, तो तुरंत OTP से दोबारा लॉगिन करें और Two-Step PIN लगाएं।"
keywords_en:
  - "whatsapp hacked"
  - "recover hacked whatsapp"
  - "whatsapp account stolen"
  - "whatsapp otp scam"
  - "someone logged into my whatsapp"
  - "whatsapp asking money from friends"
keywords_hi:
  - "व्हाट्सएप हैक हो गया"
  - "व्हाट्सएप वापस कैसे लाएं"
  - "मेरा व्हाट्सएप कोई और चला रहा है"
  - "व्हाट्सएप रिकवरी"
keywords_hinglish:
  - "whatsapp hack ho gaya"
  - "mera whatsapp account hack ho gaya hai"
  - "whatsapp recover kaise kare"
  - "whatsapp se mere dosto se paise mang raha hai"
  - "whatsapp logout ho gaya"
sample_queries:
  - "whatsapp hack ho gaya kya karu"
  - "My WhatsApp got hacked and is messaging my contacts for money"
  - "मेरा व्हाट्सएप हैक हो गया है वापस कैसे लाएं"
  - "Someone else registered my WhatsApp number"
  - "How to recover stolen WhatsApp account"
answer_en:
  - "1. Re-register immediately with your phone number: Open WhatsApp, enter your mobile number, and verify with the 6-digit SMS OTP (this automatically logs out the hacker from their phone)."
  - "2. If a Two-Step Verification PIN was set by the hacker: Wait for the 7-day countdown timer shown by WhatsApp (your account stays blocked to the hacker in the meantime) or email official WhatsApp support at support@whatsapp.com with subject 'Lost/Stolen: Please deactivate my account' and your full number (+91...)."
  - "3. Check & Remove Linked Devices: Once logged in, tap Menu (3 dots) -> Linked Devices -> log out every unknown browser/device immediately."
  - "4. Turn ON Two-Step Verification: Go to Settings -> Account -> Two-step verification -> Turn on, set a strong 6-digit PIN you never share, and add your recovery email."
  - "5. Cancel Call Forwarding: Dial ##002# on your phone dialer just in case the hacker hijacked your WhatsApp OTP via call forwarding."
  - "6. Warn your contacts immediately (via status/call/SMS) NOT to send any money or OTP requested from your account."
  - "7. Escalate to WhatsApp India Grievance Officer: If automated recovery fails, file directly at https://www.whatsapp.com/contact/forms/1534459096974129 with screenshots, registered number, and incident details. If no resolution within 15 days, appeal to Government of India GAC at https://gac.gov.in/."
  - "8. Report financial extortion or fraud at cybercrime.gov.in and dial 1930 immediately."
answer_hi:
  - "1. तुरंत अपने नंबर से दोबारा लॉगिन करें: WhatsApp खोलें, अपना मोबाइल नंबर डालें और SMS से आने वाले 6 अंकों के OTP से वेरिफाई करें। इससे हैकर के फोन से आपका WhatsApp अपने-आप लॉगआउट हो जाएगा।"
  - "2. अगर हैकर ने Two-Step PIN लगा दिया है: घबराएं नहीं — WhatsApp 7 दिन का टाइमर दिखाता है जिसके बाद बिना पिन लॉगिन हो जाता है (इस बीच हैकर भी नहीं चला पाएगा)। आप तुरंत आधिकारिक support@whatsapp.com पर ईमेल भेजकर ('Lost/Stolen: Please deactivate my account' विषय और +91 के साथ अपना नंबर लिखकर) खाता अस्थायी बंद करा सकते हैं।"
  - "3. Linked Devices जांचें: लॉगिन होते ही ऊपर 3 डॉट्स -> Linked Devices में जाकर किसी भी अनजान कंप्यूटर या डिवाइस को तुरंत Log out करें।"
  - "4. Two-Step Verification चालू करें: Settings -> Account -> Two-step verification में जाकर अपना 6 अंकों का पिन सेट करें और रिकवरी ईमेल जोड़ें।"
  - "5. कॉल फॉरवर्डिंग बंद करें: डायलर से ##002# डायल करें ताकि कोई कॉल द्वारा आपका OTP न सुन सके।"
  - "6. अपने परिवार और दोस्तों को तुरंत कॉल/स्टेटस से बता दें कि आपके नाम से पैसे मांगने वाले मैसेज पर भरोसा न करें।"
  - "7. WhatsApp इंडिया Grievance Officer को रिपोर्ट: यदि ऐप से खाता वापस न मिले, तो सीधे https://www.whatsapp.com/contact/forms/1534459096974129 पर शिकायत दर्ज करें। 15 दिन में समाधान न होने पर भारत सरकार के GAC पोर्टल (https://gac.gov.in/) पर अपील करें।"
  - "8. अगर किसी दोस्त से पैसे ठगे गए हैं तो 1930 और cybercrime.gov.in पर तुरंत शिकायत दर्ज करें।"
