title_en: "Morphed Photos / Intimate Image Abuse & StopNCII Takedown"
title_hi: "फोटो से छेड़छाड़ (Morphed Photo) / निजी तस्वीर वायरल होने पर तुरंत मदद"
summary_en: "You are NOT at fault. Stop the spread of private/intimate images using StopNCII.org digital hashing (image never leaves your phone) and file urgent takedown on NCRP."
summary_hi: "आपकी कोई गलती नहीं है, घबराएं नहीं। StopNCII.org से बिना फोटो अपलोड किए निजी तस्वीर को सोशल मीडिया पर फैलने से रोकें और cybercrime.gov.in पर तुरंत शिकायत करें।"
