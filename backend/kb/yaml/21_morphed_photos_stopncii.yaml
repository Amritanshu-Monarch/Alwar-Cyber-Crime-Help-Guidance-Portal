sample_queries:
  - "Someone morphed my photo and is threatening to share it"
  - "Private photo leak ho rahi hai kaise rukwaye StopNCII"
  - "किसी ने मेरी फोटो एडिट करके वायरल करने की धमकी दी है"
  - "How to remove intimate photos from Instagram and Facebook"
answer_en:
  - "Stay calm — you are the victim, not at fault. Do NOT pay money or follow the abuser's demands."
  - "1. Use StopNCII.org (for adults 18+) if you still have the original intimate/private photo or video on your phone: StopNCII creates a unique digital fingerprint (hash) right inside your phone browser — your photo NEVER leaves your device or gets uploaded — and shares that hash with participating platforms (Instagram, Facebook, Threads, TikTok, etc.) to automatically block and remove uploads."
  - "2. If a minor (under 18) is involved: Use Take It Down (NCMEC) and report immediately under the Women/Children section on cybercrime.gov.in and Childline 1098."
  - "3. Preserve Evidence: Take screenshots of threats, URLs where content appeared, abuser's profile IDs, and phone numbers. Do NOT delete chats."
  - "4. Report Inside Platforms: Use each platform's 'Nudity / Non-consensual intimate image / Harassment' report button directly on the post/URL."
  - "5. File Urgent Report on cybercrime.gov.in: Choose 'Report Cyber Crime Related to Women/Children' (can also report anonymously if needed, though giving contact lets police help faster and seek court/police takedown orders)."
  - "6. Call 1930 / 112 or visit Alwar Cyber Cell / Women Help Desk at your local Thana — police treat victim identity confidentially."
answer_hi:
  - "शांत रहें और खुद को दोष न दें — गलती आपकी नहीं, अपराधी की है। डरकर कभी भी पैसे न दें और न ही धमकी मानें।"
  - "1. StopNCII.org का उपयोग करें (18 वर्ष से अधिक उम्र के लिए): अगर वह निजी फोटो/वीडियो आपके फोन में मौजूद है, तो StopNCII.org पर जाएं। यह आपके ही फोन में उस फोटो का एक गुप्त डिजिटल कोड (Hash) बनाता है (आपकी फोटो कहीं अपलोड नहीं होती) और Instagram, Facebook आदि को भेज देता है ताकि कोई भी वह फोटो अपलोड न कर सके।"
  - "2. यदि मामला 18 वर्ष से कम उम्र (बच्चे/किशोर) का है: तुरंत cybercrime.gov.in के महिला/बच्चों वाले सेक्शन और चाइल्डलाइन 1098 या 112 पर सूचित करें।"
  - "3. सबूत संभाल कर रखें: धमकी भरे मैसेज, अपराधी की प्रोफाइल लिंक, फोन नंबर और जहां फोटो दिखी हो उसका URL/स्क्रीनशॉट सुरक्षित रखें। चैट डिलीट न करें।"
  - "4. ऐप के अंदर तुरंत रिपोर्ट करें: पोस्ट/फोटो पर 'Harassment' या 'Non-consensual intimate image' चुनकर रिपोर्ट करें ताकि प्लेटफॉर्म तुरंत हटा दे।"
  - "5. cybercrime.gov.in पर तुरंत शिकायत दर्ज करें: 'Report Cyber Crime Related to Women/Children' चुनें (इसमें पहचान गोपनीय रखने का विकल्प भी होता है, और पुलिस आधिकारिक तौर पर सामग्री हटवा सकती है)।"
  - "6. जरूरत हो तो 112 / 1930 पर कॉल करें या नजदीकी अलवर थाने के महिला हेल्प डेस्क / साइबर सेल से मिलें — आपकी पहचान गोपनीय रखी जाती है।"
