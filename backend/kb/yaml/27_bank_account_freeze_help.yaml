id: "bank_account_freeze"
category: "portals_reporting"
urgency: "normal"
portal_ref: "grm_portal"
title_en: "Bank Account Frozen or Lien Marked by Cyber Police — What to Do"
title_hi: "साइबर पुलिस के आदेश से बैंक खाता फ्रीज़ या होल्ड होने पर क्या करें"
summary_en: "When fraud money passes through multiple accounts (chain freeze), even innocent shops or citizens can face a lien/hold. Here is the clean legal way to resolve it."
summary_hi: "जब ठगी का पैसा किसी लेन-देन की चेन से आपके खाते में आ जाता है, तो केवल उतनी राशि या खाता होल्ड हो सकता है। इसे खुलवाने का सही तरीका जानें।"
keywords_en:
  - "bank account frozen cyber crime"
  - "lien amount in bank account"
  - "debit freeze cyber cell"
  - "how to unfreeze bank account"
  - "layer 2 layer 3 freeze"
keywords_hi:
  - "बैंक खाता फ्रीज हो गया"
  - "अकाउंट होल्ड लग गया"
  - "लीन अमाउंट कैसे हटाएं"
  - "डेबिट फ्रीज कैसे खुलेगा"
keywords_hinglish:
  - "bank account freeze ho gaya cyber cell se"
  - "mere account me lien amount aa gaya"
  - "debit freeze kaise hataye"
  - "galti se fraud ka paisa aa gaya account me"
sample_queries:
  - "My shop bank account got frozen due to a cyber crime complaint"
  - "Bank account me lien lag gaya hai kaise unfreeze karwaye"
  - "साइबर सेल ने मेरा बैंक खाता फ्रीज कर दिया है क्या करूं"
answer_en:
  - "1. Do NOT panic or pay fraudulent online 'agents' promising to unfreeze your account."
  - "2. Get Written Details from Your Bank Branch: Ask your bank for a copy of the Freeze / Lien Notice containing (a) the exact NCRP Acknowledgement Number, (b) the disputed/lien amount, and (c) the name, city, and state of the ordering Police Station / Cyber Cell."
  - "3. Fill Official GRM Bank Application Form: Download the standardized GRM application form (available in the References section), attach your KYC (Aadhaar, PAN), bank statement, and business proof (tax invoices, delivery receipts)."
  - "4. Bank Enhanced Due Diligence (EDD): Submit the form to your bank manager; the bank must complete EDD within 7 working days and forward it to the Investigating Officer (I.O.) via https://ncrp-grievanceredressal.mha.gov.in/."
  - "5. Partial Hold Request: As per standard MHA SOP instructions, if only a specific amount is disputed, request the investigating officer/bank to restrict only the disputed lien amount while allowing normal use of the remainder of your funds."
  - "6. Legal Redressal: If unresolved administratively, file an application before the jurisdictional Magistrate under Section 106 / 497 / 503 of BNSS (Bharatiya Nagarik Suraksha Sanhita, 2023)."
answer_hi:
  - "1. घबराएं नहीं और खाता खुलवाने के नाम पर ऑनलाइन किसी दलाल/एजेंट को पैसे बिल्कुल न दें।"
  - "2. बैंक से लिखित जानकारी लें: अपनी बैंक शाखा में जाकर पूछें कि (क) किस NCRP शिकायत नंबर पर खाता होल्ड हुआ है, (ख) कितनी रकम विवादित (Lien Amount) है, और (ग) किस राज्य/जिले के थाने या साइबर सेल ने आदेश भेजा है — उसकी प्रति प्राप्त करें।"
  - "3. आधिकारिक GRM बैंक आवेदन पत्र भरें: संदर्भ सेक्शन से निर्धारित GRM आवेदन पत्र डाउनलोड करें, साथ में आधार/पैन, बैंक स्टेटमेंट और असली लेन-देन का प्रमाण (दुकान का GST बिल, रसीद आदि) लगाएं।"
  - "4. बैंक द्वारा EDD व GRM पोर्टल पर प्रेषण: शाखा प्रबंधक के पास आवेदन जमा करें; SOP अनुसार बैंक 7 कार्यदिवस में EDD कर https://ncrp-grievanceredressal.mha.gov.in/ के माध्यम से जांच अधिकारी को भेजेगा।"
  - "5. केवल विवादित राशि होल्ड का अनुरोध: यदि पूरा खाता बंद (Debit Freeze) है, तो जांच अधिकारी से अनुरोध करें कि केवल विवादित रकम को होल्ड रखकर बाकी खाता सामान्य लेन-देन के लिए चालू करने की अनुमति दें।"
  - "6. विधिक उपचार: प्रशासनिक स्तर पर निस्तारण न होने पर सक्षम न्यायालय में भारतीय नागरिक सुरक्षा संहिता (BNSS) की धारा 106 / 497 / 503 के तहत आवेदन प्रस्तुत करें।"
