id: "call_forwarding_scam"
category: "device_malware"
urgency: "high"
title_en: "Call Forwarding Scam (*21* / *401* Check & Stop)"
title_hi: "कॉल फॉरवर्डिंग ठगी (*21* / *401* जांचने और बंद करने का तरीका)"
summary_en: "Fraudsters trick you into dialing *21* or *401* followed by their phone number so your calls and OTP voice calls go to them."
summary_hi: "ठग आपसे *21* या *401* लगाकर कोई नंबर डायल कराते हैं जिससे आपकी कॉल और WhatsApp/बैंक OTP कॉल उनके पास जाने लगती हैं।"
keywords_en:
  - "call forwarding scam"
  - "401 scam"
  - "21 call forward fraud"
  - "how to check call forwarding"
  - "cancel call forwarding india"
  - "otp call diverted"
keywords_hi:
  - "कॉल फॉरवर्डिंग फ्रॉड"
  - "कॉल डाइवर्ट हो गई"
  - "कॉल फॉरवर्डिंग कैसे बंद करें"
  - "स्टार 401 फ्रॉड"
keywords_hinglish:
  - "call forwarding scam ho gaya"
  - "401 dial karwa diya"
  - "21 dial karke call divert ho gaya"
  - "call forwarding kaise check aur band kare"
  - "meri call kisi aur ke paas ja rahi hai"
sample_queries:
  - "Someone tricked me into dialing *401* and my WhatsApp got hacked"
  - "Call forwarding check aur band kaise kare"
  - "मेरी कॉल किसी और नंबर पर फॉरवर्ड हो गई है कैसे हटाएं"
  - "What does *#21# do?"
answer_en:
  - "Check status right now: Open your Phone dialer and dial *#21# (and also *#62# / *#67#) to check if any calls, SMS, or data are forwarded to an unknown number."
  - "Cancel ALL call forwarding immediately: Dial ##002# and press Call — this turns off all conditional and unconditional call forwarding on Indian networks."
  - "You can also dial ##21# and check your Phone App -> Settings -> Calling Accounts / Call Forwarding to verify every option shows 'Off'."
  - "If WhatsApp or Telegram was hijacked via forwarded OTP voice call, immediately re-register WhatsApp with your own number and enable Two-Step Verification PIN."
  - "Never dial codes starting with *21*, *401*, **21*, or *67* asked by delivery boys, fake callers, or strangers."
  - "If money was deducted or an account was stolen, call 1930 and report at cybercrime.gov.in."
answer_hi:
  - "अभी जांचें: अपने फोन के डायलर में *#21# (और *#62# या *#67#) डायल करके कॉल दबाएं — स्क्रीन पर दिख जाएगा कि आपकी कॉल/SMS किसी अनजान नंबर पर फॉरवर्ड तो नहीं हैं।"
  - "सभी कॉल फॉरवर्डिंग तुरंत बंद करें: डायलर में ##002# डायल करके कॉल दबाएं। इससे हर तरह की कॉल फॉरवर्डिंग तुरंत बंद हो जाती है।"
  - "इसके अलावा आप ##21# डायल कर सकते हैं और Phone App -> Settings -> Call Forwarding में भी जांच सकते हैं कि सब बंद (Off) हो।"
  - "अगर कॉल फॉरवर्ड करके आपका WhatsApp या Telegram हैक किया गया है, तो तुरंत अपने नंबर से WhatsApp दोबारा लॉगिन करें और Two-Step Verification पिन चालू करें।"
  - "डिलीवरी बॉय या किसी अनजान व्यक्ति के कहने पर कभी भी *21*, *401* या **21* से शुरू होने वाला नंबर डायल न करें।"
  - "यदि कोई नुकसान हुआ हो तो 1930 पर कॉल करें और cybercrime.gov.in पर शिकायत दर्ज करें।"
