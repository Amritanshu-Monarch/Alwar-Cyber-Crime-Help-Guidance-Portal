id: "aeps_biometric_fraud"
category: "financial_fraud"
urgency: "emergency"
title_en: "AePS / Aadhaar Fingerprint Money Withdrawal Fraud"
title_hi: "आधार (AePS) या अंगूठा लगाकर पैसे निकलने की ठगी"
summary_en: "Money withdrawn silently via Aadhaar fingerprint cloning? Call 1930, alert your bank, and lock your Aadhaar biometrics immediately."
summary_hi: "बिना OTP या कार्ड के आधार फिंगरप्रिंट से पैसे कटने पर तुरंत 1930 पर कॉल करें और आधार बायोमेट्रिक लॉक करें।"
keywords_en:
  - "aeps fraud"
  - "aadhaar fingerprint fraud"
  - "biometric money stolen"
  - "aadhaar enabled payment fraud"
  - "money deducted via aadhaar"
keywords_hi:
  - "आधार से पैसे निकल गए"
  - "अंगूठे से पैसे कट गए"
  - "बायोमेट्रिक फ्रॉड"
  - "एईपीएस ठगी"
keywords_hinglish:
  - "aadhaar se paise nikal gaye"
  - "angutha lagakar paise nikal liye"
  - "aeps fraud ho gaya"
  - "bina otp aadhaar se paise kat gaye"
  - "aadhaar biometric lock kaise kare"
sample_queries:
  - "Someone withdrew money from my account using Aadhaar fingerprint"
  - "Bina OTP ke aadhaar se paise nikal gaye"
  - "अंगूठे के निशान से बैंक खाते से पैसे कट गए"
  - "AePS fraud complaint kaise kare"
answer_en:
  - "Call 1930 immediately and report an unauthorized AePS / Aadhaar biometric withdrawal."
  - "Inform your bank branch immediately and ask them to disable AePS transactions on your bank account."
  - "Lock your Aadhaar Biometrics right away via the official UIDAI mAadhaar app or official UIDAI website (only use official .gov.in portal; unlock only for a few minutes when you personally need KYC)."
  - "Check recent property registry, SIM verification, or local kiosk visits where your fingerprint may have been copied."
  - "File a complaint on cybercrime.gov.in with your bank statement showing the AePS withdrawal reference."
answer_hi:
  - "तुरंत 1930 पर कॉल करें और बिना अनुमति आधार (AePS) से पैसे निकलने की शिकायत दर्ज कराएं।"
  - "तुरंत अपनी बैंक शाखा में जाकर खाते पर AePS (आधार से निकासी) सेवा बंद करवाएं।"
  - "तुरंत आधिकारिक mAadhaar ऐप या सरकारी UIDAI वेबसाइट (.gov.in) पर जाकर अपना 'आधार बायोमेट्रिक लॉक' (Biometric Lock) चालू करें।"
  - "याद करें कि हाल ही में आपने कहां जमीन रजिस्ट्री, राशन या किसी दुकान पर अंगूठा लगाया था, और उसका विवरण नोट करें।"
  - "बैंक स्टेटमेंट के साथ cybercrime.gov.in पर शिकायत दर्ज करें।"
