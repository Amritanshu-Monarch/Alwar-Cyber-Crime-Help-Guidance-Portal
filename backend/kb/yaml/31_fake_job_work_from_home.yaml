id: "fake_job_task_scam"
category: "scam_alerts"
urgency: "high"
title_en: "Fake Part-Time Job / Telegram Prepaid Task / Work-From-Home Scam"
title_hi: "पार्ट-टाइम जॉब / यूट्यूब लाइक / Telegram टास्क ठगी"
summary_en: "Scammers pay small rewards (₹150-₹500) first for liking videos or rating hotels, then trap you in 'prepaid VIP tasks' and block withdrawal until you deposit lakhs."
summary_hi: "पहले वीडियो लाइक या होटल रिव्यू करने पर 150-500 रुपये देकर भरोसा जीतते हैं, फिर 'प्रीपेड टास्क' में लाखों रुपये डलवाकर पैसे फंसा लेते हैं।"
keywords_en:
  - "fake job scam"
  - "telegram task scam"
  - "youtube video like job fraud"
  - "google maps review earning scam"
  - "prepaid task fraud"
  - "work from home scam"
keywords_hi:
  - "पार्ट टाइम जॉब फ्रॉड"
  - "टेलीग्राम टास्क ठगी"
  - "यूट्यूब लाइक करने के पैसे"
  - "घर बैठे कमाई स्कैम"
keywords_hinglish:
  - "telegram task scam me paise fas gaye"
  - "part time job work from home fraud"
  - "youtube like karke paise kamane wala scam"
  - "prepaid task me paisa dub gaya"
sample_queries:
  - "I got trapped in a Telegram prepaid task scam and lost 50000"
  - "YouTube like job scam ho gaya paise wapas kaise milega"
  - "पार्ट टाइम जॉब और टेलीग्राम टास्क के नाम पर ठगी हो गई"
answer_en:
  - "1. STOP DEPOSITING IMMEDIATELY: Never pay 'tax', 'credit score fee', or 'final task deposit' to unlock frozen earnings — the fake app/website screen numbers are completely rigged."
  - "2. Call 1930 right away with every UTR / Transaction ID, amount, and date/time for all payments you sent."
  - "3. Preserve Evidence: Take screenshots of the Telegram group, HR/mentor chat, fake dashboard/website URL, and all UPI IDs or bank accounts where you sent money."
  - "4. Exit & Block the Telegram/WhatsApp scam groups once screenshots are saved."
  - "5. File a full complaint on cybercrime.gov.in listing every transaction ID (you can add multiple transactions in NCRP) and save your Acknowledgement Number."
  - "6. Remember: Legitimate employers pay YOU salary — they NEVER ask you to deposit money to earn commission."
answer_hi:
  - "1. और पैसे डालना तुरंत बंद करें: फंसा हुआ पैसा निकालने के लिए ठग 'टैक्स', 'क्रेडिट स्कोर' या 'आखिरी टास्क' के नाम पर और पैसे मांगते हैं — एक रुपया भी न डालें, वेबसाइट पर दिखने वाला मुनाफा नकली होता है।"
  - "2. तुरंत 1930 पर कॉल करें और जितने भी ट्रांज़ैक्शन आपने किए हैं, उन सभी के UTR नंबर, तारीख और रकम दर्ज कराएं।"
  - "3. सारे सबूत संभाल लें: टेलीग्राम ग्रुप, एजेंट की चैट, नकली वेबसाइट का लिंक, और जिन-जिन UPI/बैंक खातों में पैसे भेजे हैं उनके स्क्रीनशॉट सेव करें।"
  - "4. सबूत लेने के बाद उन फर्जी ग्रुप से बाहर निकलें और ठग को ब्लॉक करें।"
  - "5. cybercrime.gov.in पर सभी ट्रांज़ैक्शन की जानकारी के साथ शिकायत दर्ज करें और रसीद नंबर संभालें।"
  - "6. याद रखें: कोई भी असली नौकरी आपसे काम देने के बदले पैसे जमा नहीं करवाती।"
