id: "instagram_hacked"
category: "social_media"
urgency: "high"
title_en: "Instagram Account Hacked — Official Recovery & Video Selfie"
title_hi: "Instagram अकाउंट हैक होने पर वापस पाने का तरीका"
summary_en: "Recover a hacked Instagram account using instagram.com/hacked, login links, or official video selfie verification — never pay 'hackers' on social media."
summary_hi: "इंस्टाग्राम हैक होने पर केवल आधिकारिक instagram.com/hacked और वीडियो सेल्फी सत्यापन का उपयोग करें। रिकवरी के नाम पर किसी को पैसे न दें।"
keywords_en:
  - "instagram hacked"
  - "recover hacked instagram"
  - "ig account hacked"
  - "instagram video selfie recovery"
  - "hacker changed instagram email"
keywords_hi:
  - "इंस्टाग्राम हैक हो गया"
  - "इंस्टाग्राम आईडी वापस कैसे लाएं"
  - "इंस्टा अकाउंट हैक"
keywords_hinglish:
  - "instagram hack ho gaya"
  - "insta id recover kaise kare"
  - "instagram ka password change kar diya"
  - "mera instagram kisi ne hack kar liya"
sample_queries:
  - "My Instagram account was hacked and username changed"
  - "Instagram hack ho gaya wapas kaise laye"
  - "मेरा इंस्टाग्राम अकाउंट हैक हो गया है कैसे रिकवर करें"
  - "How to do Instagram video selfie recovery"
answer_en:
  - "1. Open ONLY the official Instagram recovery page: Visit https://www.instagram.com/hacked/ in your phone browser."
  - "2. Choose 'My account was hacked', enter your username, phone, or email, and follow the steps to request a login link or security code."
  - "3. Check your email for a security alert from security@mail.instagram.com saying your email/password was changed — tap 'Secure my account' inside that official email to revert the change."
  - "4. Video Selfie Verification: If you have photos of yourself on your account and cannot access email/phone, tap 'Need more help?' -> 'Yes, take a video selfie to confirm my account' inside the Instagram app."
  - "5. WARNING: Never pay anyone online or on Telegram/Instagram claiming they can 'hack back' or recover your account — those are secondary scammers."
  - "6. Once recovered: Go to Accounts Center -> Password and security -> Where you're logged in -> remove unknown devices, change password, and turn ON Two-Factor Authentication (2FA)."
  - "7. Escalate to Meta (Instagram) Grievance Officer: If automated recovery and video selfie do not restore your account, file a complaint directly with Meta's India Grievance Officer at https://help.meta.com/requests/1371776380779082/. Under IT Rules 2021, if not resolved in 15 days, appeal to Government of India GAC at https://gac.gov.in/."
  - "8. Report at cybercrime.gov.in if the hacker is blackmailing you or scamming your followers."
answer_hi:
  - "1. केवल आधिकारिक पेज खोलें: अपने मोबाइल ब्राउज़र में https://www.instagram.com/hacked/ खोलें।"
  - "2. 'My account was hacked' चुनें और अपना यूज़रनेम, मोबाइल नंबर या ईमेल डालकर लॉगिन लिंक या कोड मंगवाएं।"
  - "3. अपना ईमेल इनबॉक्स जांचें — अगर security@mail.instagram.com से ईमेल बदलने का अलर्ट आया है, तो उसमें 'Secure my account' पर क्लिक करके बदलाव वापस रोक सकते हैं।"
  - "4. वीडियो सेल्फी सत्यापन (Video Selfie): अगर ईमेल व नंबर दोनों बदल गए हैं और आपकी प्रोफाइल पर आपकी फोटो मौजूद हैं, तो ऐप में 'Need more help?' पर जाकर वीडियो सेल्फी के जरिए पहचान सत्यापित करें।"
  - "5. चेतावनी: सोशल मीडिया पर 'अकाउंट रिकवर कराने' के नाम पर पैसे मांगने वाले किसी भी व्यक्ति को पैसे न दें — वे खुद ठग होते हैं।"
  - "6. अकाउंट वापस मिलते ही Accounts Center -> Password and security में जाकर अनजान डिवाइस हटाएं, पासवर्ड बदलें और Two-Factor Authentication (2FA) चालू करें।"
  - "7. Meta (Instagram) Grievance Officer को शिकायत: यदि ऐप रिकवरी और वीडियो सेल्फी से खाता वापस न मिले, तो सीधे Meta Grievance Officer के फॉर्म https://help.meta.com/requests/1371776380779082/ पर शिकायत भेजें। 15 दिन में राहत न मिलने पर भारत सरकार के GAC पोर्टल https://gac.gov.in/ पर अपील करें।"
  - "8. अगर हैकर आपके फॉलोअर्स से पैसे मांग रहा है या धमकी दे रहा है, तो cybercrime.gov.in पर शिकायत दर्ज करें।"
