id: "evidence_checklist"
category: "portals_reporting"
urgency: "normal"
title_en: "What Evidence to Collect & Keep Safe for Cyber Complaints"
title_hi: "साइबर शिकायत के लिए कौन-से सबूत सुरक्षित रखने चाहिए"
summary_en: "Strong evidence speeds up bank holds, complaint investigation, and court refund orders. Never format your phone or delete chats before saving proof."
summary_hi: "सही और पूरे सबूत होने से पुलिस जांच और बैंक से पैसे वापस मिलने की प्रक्रिया तेज होती है। सबूत संभालने से पहले चैट या कॉल रिकॉर्ड डिलीट न करें।"
keywords_en:
  - "evidence to keep"
  - "documents for cyber complaint"
  - "screenshots for 1930"
  - "utr number"
  - "proof for cyber police"
keywords_hi:
  - "सबूत क्या रखें"
  - "साइबर शिकायत के दस्तावेज़"
  - "स्क्रीनशॉट और स्टेटमेंट"
  - "यूटीआर नंबर"
keywords_hinglish:
  - "cyber complaint ke liye kya documents chahiye"
  - "police ko kya proof dikhaye"
  - "evidence checklist cyber fraud"
sample_queries:
  - "What evidence and documents do I need for a cyber crime complaint?"
  - "Thane me cyber fraud report ke liye kya kya le jana hoga"
  - "साइबर क्राइम की शिकायत के लिए क्या सबूत चाहिए"
answer_en:
  - "1. Financial Proof: Bank statement (PDF or bank-stamped printout), SMS debit alerts, and exact 12-digit UTR / UPI Transaction Reference numbers with date, time, and amount."
  - "2. Fraudster Identifiers: Scammer's mobile numbers, WhatsApp numbers, UPI IDs, bank account numbers, or QR code images."
  - "3. Digital Communication: Uncropped screenshots of WhatsApp/Telegram/SMS chats, emails (with full sender email address), and call history logs."
  - "4. Links & Apps: Exact website URLs, fake app APK name/file (do NOT keep installed on main phone — note its package name or save screenshot of download link)."
  - "5. Social Media Proof: Exact profile URL/handle (not just display name) and screenshots of impersonation/harassment posts."
  - "6. Personal ID & NCRP Copy: Your Aadhaar/ID copy and the 14-digit NCRP Acknowledgement PDF."
answer_hi:
  - "1. बैंक व पेमेंट के सबूत: बैंक स्टेटमेंट (PDF या बैंक की मुहर लगी कॉपी), पैसे कटने का SMS और सही 12 अंकों का UTR / ट्रांज़ैक्शन नंबर (तारीख व समय सहित)।"
  - "2. ठग की पहचान: ठग का मोबाइल नंबर, WhatsApp नंबर, UPI आईडी, बैंक खाता नंबर या भेजा गया QR कोड।"
  - "3. बातचीत के सबूत: WhatsApp/Telegram/SMS चैट, ईमेल और कॉल हिस्ट्री के पूरे और साफ स्क्रीनशॉट (बिना काटे-छांटे)।"
  - "4. संदिग्ध लिंक व ऐप: फर्जी वेबसाइट का पूरा लिंक या जिस APK फाइल से ठगी हुई उसका नाम/स्क्रीनशॉट।"
  - "5. सोशल मीडिया सबूत: नकली या धमकी देने वाली प्रोफाइल का पूरा लिंक (URL) और पोस्ट के स्क्रीनशॉट।"
  - "6. पहचान व रसीद: आपका पहचान पत्र (आधार) और cybercrime.gov.in की रसीद (Acknowledgement PDF)।"
