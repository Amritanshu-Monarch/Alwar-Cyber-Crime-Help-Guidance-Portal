sample_queries:
  - "What is GRM portal?"
  - "My bank account was mistakenly frozen by cyber cell, how to use GRM?"
  - "मेरा बैंक खाता गलती से होल्ड हो गया है अनफ्रीज कैसे कराएं"
  - "GRM portal documents and timeline"
  - "Account par lien lag gaya hai kaise hatega"
answer_en:
  - "What it is for: GRM (Grievance Redressal Mechanism under MHA I4C NCRP-CFCFRMS SOP dated 02.01.2026, Rule 10) handles citizen grievances — especially when a genuine merchant or citizen's bank account/funds are mistakenly frozen/lien-marked during cyber crime investigation tracing."
  - "Who can use it: Account holders affected by mistaken debit hold/freeze or complainants seeking escalation on complaint handling."
  - "Documents needed: Official GRM Bank Application Form, bank freeze/lien notice with 14-digit NCRP Acknowledgement Number and ordering police station, Aadhaar/PAN KYC, bank statement, and genuine transaction proof (tax invoices, sale bills, delivery receipts)."
  - "Step 1: Obtain written freeze notice from your bank branch with the NCRP complaint number and ordering police station details."
  - "Step 2: Submit the completed GRM Bank Application Form and transaction proofs to your bank branch for Enhanced Due Diligence (EDD within 7 working days)."
  - "Step 3: The bank submits the grievance to the Investigating Officer (I.O.) via the official GRM Portal (https://ncrp-grievanceredressal.mha.gov.in/)."
  - "Step 4: The I.O. inquires within 15 days; if satisfied, instructs the bank within 48 hours to remove hold and restore digital services."
  - "Step 5: If not resolved, escalate to District Grievance Officer (15 days), State Grievance Officer (15 days), or file an application under BNSS 106/497/503 in competent court."
answer_hi:
  - "यह किस लिए है: GRM (गृह मंत्रालय I4C SOP 02.01.2026, नियम 10 के तहत शिकायत निवारण तंत्र) का उपयोग तब किया जाता है जब किसी निर्दोष व्यक्ति या व्यापारी का बैंक खाता/रकम साइबर अपराध जांच की ट्रेसिंग में गलती से होल्ड या डेबिट फ्रीज़ हो जाए।"
  - "कौन उपयोग कर सकता है: वे नागरिक या व्यापारी जिनका खाता गलती से फ्रीज़/लीन हुआ है, या जिन्हें शिकायत प्रक्रिया में समाधान चाहिए।"
  - "जरूरी दस्तावेज़: आधिकारिक GRM बैंक आवेदन पत्र, बैंक से मिला होल्ड नोटिस (NCRP नंबर और थाने का नाम सहित), आधार/पैन कार्ड, बैंक स्टेटमेंट, और असली लेन-देन का प्रमाण (GST बिल, दुकान की रसीद, इनवॉइस)।"
  - "कदम 1: सबसे पहले अपनी बैंक शाखा से लिखित नोटिस लें जिसमें NCRP शिकायत संख्या और आदेश देने वाले थाने का नाम अंकित हो।"
  - "कदम 2: औपचारिक GRM आवेदन पत्र भरकर अपनी बैंक शाखा में जमा करें; बैंक 7 कार्यदिवस में Enhanced Due Diligence (EDD) की प्रक्रिया पूरी करेगा।"
  - "कदम 3: बैंक द्वारा GRM पोर्टल (https://ncrp-grievanceredressal.mha.gov.in/) पर शिकायत दर्ज कर संबंधित जांच अधिकारी (I.O.) को रिपोर्ट भेजी जाएगी।"
  - "कदम 4: जांच अधिकारी 15 दिन में समीक्षा करेगा; औचित्य संतोषजनक पाए जाने पर 48 घंटे के भीतर बैंक को होल्ड हटाने व डिजिटल सेवाएं बहाल करने का आदेश देगा।"
  - "कदम 5: असंतुष्ट रहने पर जिला शिकायत अधिकारी (15 दिन), राज्य शिकायत अधिकारी (15 दिन) या सक्षम न्यायालय में BNSS धारा 106/497/503 के तहत आवेदन करें।"
