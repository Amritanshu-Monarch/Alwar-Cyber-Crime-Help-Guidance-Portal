title_en: "GRM Portal — Grievance Redressal & Account Unfreeze Guide"
title_hi: "GRM पोर्टल — शिकायत निवारण व गलती से फ्रीज़ हुए खाते की मदद"
summary_en: "Learn what the GRM Portal is used for, who can file a grievance (e.g., mistaken bank lien/freeze or complaint escalation), required documents, and steps."
summary_hi: "जानें GRM पोर्टल किस लिए है, गलती से खाता/राशि फ्रीज़ होने या शिकायत से जुड़ी समस्या में इसका उपयोग कैसे करें।"
