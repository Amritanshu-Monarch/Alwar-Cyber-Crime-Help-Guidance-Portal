id: "card_atm_fraud"
category: "financial_fraud"
urgency: "emergency"
title_en: "Debit / Credit Card & ATM Fraud"
title_hi: "डेबिट / क्रेडिट कार्ड और ATM धोखाधड़ी"
summary_en: "Unauthorized card transactions or ATM skimming require immediate card hotlisting, bank dispute filing, and 1930 reporting."
summary_hi: "बिना आपकी मर्जी के कार्ड से पैसे कटने या ATM से ठगी होने पर तुरंत कार्ड ब्लॉक करवाएं और 1930 पर शिकायत करें।"
keywords_en:
  - "credit card fraud"
  - "debit card fraud"
  - "atm fraud"
  - "card cloned"
  - "unauthorized card transaction"
  - "card details stolen"
  - "atm card swap"
keywords_hi:
  - "क्रेडिट कार्ड फ्रॉड"
  - "डेबिट कार्ड ठगी"
  - "एटीएम कार्ड से पैसे कट गए"
  - "कार्ड क्लोनिंग"
  - "एटीएम में कार्ड बदल दिया"
keywords_hinglish:
  - "atm card se paise kat gaye"
  - "credit card fraud ho gaya"
  - "debit card bina use kiye paise kat gaye"
  - "atm machine me card fas gaya"
  - "card block kaise kare"
  - "card hack ho gaya"
sample_queries:
  - "My credit card was charged without my permission"
  - "ATM se kisi ne mera card badal ke paise nikal liye"
  - "डेबिट कार्ड से बिना OTP पैसे कट गए"
  - "Debit card se international transaction ho gaya"
  - "Someone cloned my ATM card"
answer_en:
  - "Hotlist / block your Debit or Credit card immediately using your bank's official mobile app, SMS banking, or official helpline."
  - "Call 1930 immediately and report the unauthorized card transactions."
  - "Disable International Transactions, Online (E-Com), and Tap-and-Pay / NFC on any remaining cards in your bank app."
  - "Visit your bank branch within 3 days to submit a written 'Unauthorized Transaction Dispute / Chargeback' form (RBI zero-liability protection rules depend on timely reporting)."
  - "If your ATM card was swapped or trapped at an ATM booth, alert the bank/guard immediately and note the ATM ID, date, time, and location for CCTV footage preservation."
  - "File a complaint on cybercrime.gov.in and attach the bank statement showing the unauthorized debits."
answer_hi:
  - "सबसे पहले अपने बैंक के आधिकारिक मोबाइल ऐप या बैंक के असली हेल्पलाइन नंबर से अपना डेबिट/क्रेडिट कार्ड तुरंत ब्लॉक (Hotlist) करें।"
  - "तुरंत 1930 पर कॉल करके अनधिकृत लेन-देन की शिकायत दर्ज कराएं।"
  - "अपने दूसरे कार्ड्स पर भी बैंक ऐप में जाकर इंटरनेशनल पेमेंट, ऑनलाइन ट्रांज़ैक्शन और बिना पिन (Tap & Pay/NFC) सुविधा बंद कर दें।"
  - "3 दिनों के भीतर अपनी बैंक शाखा में जाकर 'Unauthorized Transaction Dispute / Chargeback' का लिखित आवेदन दें (समय पर सूचना देने पर RBI नियमों के तहत सुरक्षा मिलती है)।"
  - "अगर ATM बूथ पर किसी ने धोखे से आपका कार्ड बदला है या कार्ड मशीन में फंस गया है, तो तुरंत बैंक को बताएं और ATM की लोकेशन व समय नोट करें ताकि CCTV फुटेज सुरक्षित रह सके।"
  - "cybercrime.gov.in पर भी शिकायत दर्ज करें और बैंक स्टेटमेंट संलग्न करें।"
