id: "digital_arrest_scam"
category: "scam_alerts"
urgency: "emergency"
title_en: "Digital Arrest Scam (Fake Police / CBI / TRAI / Customs Video Call)"
title_hi: "डिजिटल अरेस्ट ठगी (नकली पुलिस / CBI / कस्टम वीडियो कॉल से सावधान)"
summary_en: "There is NO such thing as 'Digital Arrest' under Indian law. Police, CBI, ED, or Courts NEVER interrogate or demand money over WhatsApp/Skype video calls."
summary_hi: "कानून में 'डिजिटल अरेस्ट' नाम की कोई चीज नहीं होती! असली पुलिस, CBI या कोर्ट कभी भी वीडियो कॉल पर गिरफ्तारी नहीं करते और न ही पैसे मांगते हैं।"
keywords_en:
  - "digital arrest"
  - "fake police video call"
  - "cbi ed scam call"
  - "trai sim block threat call"
  - "fedex drugs parcel police scam"
  - "customs parcel arrest call"
keywords_hi:
  - "डिजिटल अरेस्ट"
  - "नकली पुलिस वीडियो कॉल"
  - "सीबीआई धमकी कॉल"
  - "पार्सल में ड्रग्स बताकर धमकी"
  - "नकली पुलिस गिरफ्तारी"
keywords_hinglish:
  - "digital arrest scam"
  - "police uniform me video call aa raha hai"
  - "cbi officer bol kar dhamka raha hai"
  - "trai se call aaya sim band hoga"
  - "parcel me drugs bol kar video call par rakha hai"
sample_queries:
  - "Someone dressed as police on Skype video call says I am under digital arrest"
  - "Digital arrest ke naam par paise mang rahe hain"
  - "नकली पुलिस अधिकारी वीडियो कॉल पर गिरफ्तारी की धमकी दे रहा है"
  - "TRAI automated call saying my number will be disconnected in 2 hours"
answer_en:
  - "1. HANG UP IMMEDIATELY: There is NO legal concept of 'Digital Arrest' in India. Real Police/CBI/ED/Customs NEVER detain you on Skype/WhatsApp video or tell you 'do not tell anyone'."
  - "2. NEVER Transfer 'Security Deposit / RBI Verification' Money: Fraudsters frighten victims with fake arrest warrants and demand money to 'clear your bank account'. Genuine authorities NEVER ask you to transfer funds to verify innocence."
  - "3. Talk to a Trusted Family Member or Visit Your Local Alwar Thana right away if you feel scared — isolation is how scammers control victims."
  - "4. Take screenshots of the caller's number, fake ID card, fake court warrant PDF, and Skype/WhatsApp screen before disconnecting/blocking."
  - "5. If you already transferred money: Call 1930 IMMEDIATELY to freeze the recipient bank account."
  - "6. Report the call number and details on cybercrime.gov.in (and Chakshu/Sanchar Saathi if available)."
answer_hi:
  - "1. तुरंत कॉल काट दें: भारत के कानून में 'डिजिटल अरेस्ट' नाम की कोई प्रक्रिया नहीं है। असली पुलिस, CBI, ED या कोर्ट कभी भी WhatsApp/Skype वीडियो कॉल पर पूछताछ नहीं करते और न ही यह कहते हैं कि 'कमरा बंद रखो, किसी को मत बताओ'।"
  - "2. जांच के नाम पर एक भी रुपया ट्रांसफर न करें: ठग नकली वर्दी पहनकर, नकली अरेस्ट वारंट दिखाकर खाते की जांच (RBI Verification) के नाम पर पैसे ट्रांसफर कराते हैं। सरकारी एजेंसी कभी पैसे नहीं मांगती।"
  - "3. तुरंत परिवार के किसी सदस्य से बात करें या अपने नजदीकी अलवर पुलिस थाने चले जाएं — ठग आपको डराकर अकेला रखते हैं।"
  - "4. कॉल काटने से पहले ठग के नंबर, नकली पुलिस फोटो/वारंट और चैट के स्क्रीनशॉट ले लें।"
  - "5. अगर डर के कारण पैसे ट्रांसफर कर दिए हैं: तुरंत 1930 पर कॉल करें ताकि पैसे बैंक में रोके जा सकें।"
  - "6. cybercrime.gov.in पर इस नंबर और घटना की शिकायत दर्ज करें।"
