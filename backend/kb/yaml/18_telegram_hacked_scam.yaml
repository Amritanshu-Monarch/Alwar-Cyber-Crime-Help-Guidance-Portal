id: "telegram_hacked"
category: "social_media"
urgency: "high"
title_en: "Telegram Account Hacked or Compromised — Recovery Steps"
title_hi: "Telegram अकाउंट हैक होने पर सुरक्षित करने का तरीका"
summary_en: "Telegram accounts are often hijacked via fake 'verification' links or OTP scams. Terminate unknown sessions immediately and enable Two-Step Verification."
summary_hi: "Telegram अक्सर फर्जी 'वेरिफिकेशन' लिंक या OTP ठगी से हैक होता है। तुरंत अनजान डिवाइस हटाएं और Two-Step पासवर्ड लगाएं।"
keywords_en:
  - "telegram hacked"
  - "recover telegram account"
  - "telegram scam bot"
  - "unknown device in telegram"
  - "terminate telegram sessions"
keywords_hi:
  - "टेलीग्राम हैक हो गया"
  - "टेलीग्राम अकाउंट रिकवर"
  - "टेलीग्राम लॉगिन फ्रॉड"
keywords_hinglish:
  - "telegram hack ho gaya"
  - "telegram par unknown login dikha raha hai"
  - "telegram recover kaise kare"
sample_queries:
  - "My Telegram account was hacked by a fake verification bot"
  - "Telegram hack ho gaya kaise bachaye"
  - "मेरा टेलीग्राम अकाउंट कोई और चला रहा है"
  - "How to remove hacker session from Telegram"
answer_en:
  - "1. If you still have access: Open Telegram -> Settings -> Devices -> tap 'Terminate All Other Sessions' immediately."
  - "2. Note: Telegram makes newly logged-in devices wait ~24 hours before they can terminate older sessions; if blocked, wait or contact official Telegram Support."
  - "3. Enable Two-Step Verification right away: Settings -> Privacy and Security -> Two-Step Verification -> set a strong cloud password and recovery email."
  - "4. If you are locked out and a hacker set a Two-Step password you don't know: Use the official Telegram login flow to request account reset (note: resetting deletes chats/channels after the waiting period so the hacker loses access too)."
  - "5. Never enter your Telegram login code or phone number on links sent inside Telegram groups/bots."
  - "6. Report financial/extortion abuse via cybercrime.gov.in and 1930."
  - "7. Official Telegram Support & GAC Appeal: Submit details, screenshots, and affected phone number directly to Telegram Support at https://telegram.org/support. If unresolved within 15 days, appeal to the Government of India Grievance Appellate Committee (GAC) at https://gac.gov.in/."
answer_hi:
  - "1. अगर आपका Telegram अभी खुल रहा है: तुरंत Settings -> Devices में जाकर 'Terminate All Other Sessions' दबाएं ताकि बाकी सभी डिवाइस लॉगआउट हो जाएं।"
  - "2. ध्यान दें: नए लॉगिन के बाद Telegram सुरक्षा के लिए लगभग 24 घंटे तक पुराने सेशन हटाने से रोक सकता है — घबराएं नहीं और समय पूरा होते ही हटा दें या आधिकारिक सहायता लें।"
  - "3. तुरंत Two-Step Verification चालू करें: Settings -> Privacy and Security -> Two-Step Verification में जाकर अपना पासवर्ड और ईमेल सेट करें।"
  - "4. अगर हैकर ने Two-Step पासवर्ड लगा दिया है और आप लॉगिन नहीं कर पा रहे, तो लॉगिन स्क्रीन पर 'Forgot password' / Reset Account विकल्प का उपयोग करें (इससे सुरक्षा के लिए पुराना डेटा हटकर आपका नंबर मुक्त हो जाता है)।"
  - "5. किसी भी अनजान ग्रुप, चैनल या बॉट द्वारा भेजे लिंक पर अपना फोन नंबर या Telegram OTP कोड कभी न डालें।"
  - "6. यदि ठगी या धमकी हो तो 1930 और cybercrime.gov.in पर शिकायत दर्ज करें।"
  - "7. आधिकारिक Telegram Support व GAC अपील: स्क्रीनशॉट व विवरण सहित Telegram सपोर्ट फॉर्म https://telegram.org/support पर शिकायत भेजें। 15 दिन में राहत न मिलने पर भारत सरकार के GAC पोर्टल https://gac.gov.in/ पर अपील करें।"
