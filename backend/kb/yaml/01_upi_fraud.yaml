id: "upi_fraud"
category: "financial_fraud"
urgency: "emergency"
title_en: "UPI / PhonePe / GPay / Paytm Money Fraud"
title_hi: "UPI / PhonePe / Google Pay / Paytm से पैसे कटने की ठगी"
summary_en: "Act within the Golden Hour (first 1-2 hours). Call 1930 immediately so the bank can freeze the fraudster's account before money is withdrawn."
summary_hi: "घबराएं नहीं, पहले 1-2 घंटे बहुत जरूरी हैं। तुरंत 1930 पर कॉल करें ताकि बैंक ठग के खाते में पैसे रोक सके।"
