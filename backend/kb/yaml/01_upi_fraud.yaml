  - "paisa kat gaya upi se"
  - "Someone took money from my PhonePe without permission"
  - "मेरे खाते से UPI द्वारा पैसे कट गए क्या करूं"
  - "Google Pay se 10000 kat gaye"
  - "UPI collect request approve karne par paise chale gaye"
  - "Paytm fraud complaint kaise kare"
answer_en:
  - "Call 1930 immediately (National Cyber Crime Helpline) — the faster you call, the higher the chance of freezing the money."
  - "Keep these ready for the 1930 call: your bank name, account/UPI ID, exact amount, date & time, and the 12-digit UTR / Transaction ID."
  - "Call your bank's official customer care (number printed on the back of your ATM card or official bank app) to report unauthorized debit and temporarily block UPI/netbanking."
  - "Disable UPI in PhonePe/GPay/Paytm or deregister your UPI ID if you suspect your phone or PIN is compromised."
  - "Take clear screenshots of the transaction, SMS alert, fraudster's UPI ID/phone number, and any chat or call log."
  - "File the detailed complaint on cybercrime.gov.in (NCRP) within 24 hours and save the 14-digit Acknowledgement Number."
  - "Visit your nearest Alwar Police Station or Cyber Cell with printed screenshots and bank statement if asked or for follow-up."
answer_hi:
  - "सबसे पहले तुरंत 1930 (राष्ट्रीय साइबर हेल्पलाइन) पर कॉल करें — जितनी जल्दी कॉल करेंगे, पैसे रुकने की उम्मीद उतनी ज्यादा होगी।"
  - "कॉल करने से पहले ये जानकारी पास रखें: बैंक का नाम, आपका UPI/खाता नंबर, कटी हुई रकम, तारीख-समय और 12 अंकों का UTR / ट्रांज़ैक्शन नंबर।"
  - "तुरंत अपने बैंक के आधिकारिक कस्टमर केयर (ATM कार्ड के पीछे लिखे नंबर) पर फोन करके धोखाधड़ी की जानकारी दें और UPI/नेटबैंकिंग बंद करवाएं।"
  - "यदि शक हो कि आपका फोन या पिन असुरक्षित है, तो PhonePe/GPay/Paytm में जाकर अपना UPI तुरंत बंद (Disable) करें।"
  - "पेमेंट स्क्रीनशॉट, बैंक SMS, ठग का मोबाइल नंबर/UPI आईडी और कॉल/चैट के स्क्रीनशॉट संभाल कर रखें।"
  - "24 घंटे के अंदर cybercrime.gov.in पर पूरी शिकायत दर्ज करें और मिलने वाला 14 अंकों का रसीद नंबर (Acknowledgement Number) सुरक्षित रखें।"
  - "जरूरत पड़ने पर प्रिंटेड सबूत और बैंक स्टेटमेंट लेकर अपने नजदीकी अलवर पुलिस थाने या साइबर सेल में जाएं।"
