id: "safe_browsing_tips"
category: "cyber_hygiene"
urgency: "normal"
title_en: "Safe Browsing, App Permissions & Public Wi-Fi Tips"
title_hi: "सुरक्षित इंटरनेट ब्राउज़िंग, ऐप परमिशन और पब्लिक Wi-Fi के नियम"
summary_en: "Simple daily habits for Android and UPI users in Alwar to prevent malware, phishing websites, and unauthorized spying."
summary_hi: "रोजमर्रा के फोन उपयोग में आसान सावधानियां अपनाकर आप 95% साइबर ठगी से खुद को बचा सकते हैं।"
keywords_en:
  - "safe browsing tips"
  - "public wifi safety"
  - "app permissions android"
  - "safe upi habits"
  - "cyber safety tips"
keywords_hi:
  - "सुरक्षित इंटरनेट कैसे चलाएं"
  - "पब्लिक वाईफाई खतरा"
  - "साइबर सुरक्षा टिप्स"
  - "ऐप परमिशन कैसे जांचें"
keywords_hinglish:
  - "cyber fraud se bachne ke tips"
  - "safe browsing kaise kare"
  - "public wifi par bank use karna chahiye kya"
sample_queries:
  - "What are the best daily safe browsing and UPI tips?"
  - "Cyber fraud se bachne ke liye kya savdhani rakhe"
  - "इंटरनेट और फोन सुरक्षित रखने के आसान नियम बताएं"
answer_en:
  - "1. Download Apps ONLY from Google Play Store / Apple App Store: Never install apps sent as '.apk' files on WhatsApp, Telegram, or SMS links."
  - "2. Check App Permissions: A torch, wallpaper, or photo-editor app does NOT need Contacts, SMS, or Accessibility permission. Deny unnecessary permissions."
  - "3. Avoid Banking on Free Public Wi-Fi: Do not log into netbanking or enter card details over open/free Wi-Fi at railway stations, buses, or cafes — use your own mobile data."
  - "4. Check Website Lock & Exact Spelling: Before entering login/payment details, verify the exact official domain name (e.g., '.gov.in' for govt sites, official bank URL) — not lookalike URLs."
  - "5. Keep Phone & Apps Updated: Install Android security updates and enable Google Play Protect."
  - "6. Set Daily UPI & Card Transaction Limits: In your bank app, keep low daily transaction limits for online/ATM/UPI so even if fraud happens, loss stays limited."
answer_hi:
  - "1. ऐप सिर्फ Google Play Store / Apple App Store से ही डाउनलोड करें: WhatsApp, Telegram या SMS में आई कोई भी .apk फाइल कभी इंस्टॉल न करें।"
  - "2. बेकार ऐप परमिशन न दें: टॉर्च, कैलकुलेटर या फोटो एडिट करने वाले ऐप को आपके SMS, Contacts या Accessibility की जरूरत नहीं होती — ऐसी परमिशन बंद रखें।"
  - "3. फ्री पब्लिक Wi-Fi पर बैंक काम न करें: रेलवे स्टेशन, बस स्टैंड या होटल के फ्री Wi-Fi पर नेटबैंकिंग या कार्ड पेमेंट न करें, अपना मोबाइल डेटा उपयोग करें।"
  - "4. वेबसाइट का सही नाम देखें: लॉगिन या पेमेंट करने से पहले वेबसाइट की स्पेलिंग जांचें (सरकारी वेबसाइट के अंत में '.gov.in' या '.nic.in' होता है)।"
  - "5. फोन और ऐप्स अपडेट रखें: समय-समय पर मोबाइल का सॉफ्टवेयर अपडेट करें और Google Play Protect हमेशा चालू रखें।"
  - "6. बैंक कार्ड व UPI की रोज की लिमिट कम रखें: अपने बैंक ऐप में जाकर रोजाना खर्च की लिमिट जरूरत के हिसाब से कम सेट रखें ताकि अनहोनी में बड़ा नुकसान न हो।"
