id: "loan_app_harassment"
category: "scam_alerts"
urgency: "emergency"
title_en: "Illegal Instant Loan App Blackmail & Contact Harassment"
title_hi: "फर्जी लोन ऐप (Loan App) की ब्लैकमेलिंग और धमकी से बचाव"
summary_en: "7-day loan apps steal your contacts/gallery and send morphed photos to relatives even after repayment. Do NOT pay endless extortion — follow these steps."
summary_hi: "7-दिन वाले अवैध लोन ऐप आपके कॉन्टैक्ट्स व फोटो चुराकर रिश्तेदारों को बदनाम करने की धमकी देते हैं। डरें नहीं और न ही बार-बार पैसे दें — तुरंत शिकायत करें।"
keywords_en:
  - "loan app harassment"
  - "instant loan app blackmail"
  - "7 day loan app scam"
  - "loan app calling contacts"
  - "fake loan app morphed photo"
keywords_hi:
  - "लोन ऐप ब्लैकमेल"
  - "फर्जी लोन ऐप धमकी"
  - "कॉन्टैक्ट लिस्ट पर मैसेज भेज रहा है"
  - "लोन ऐप से बचाव"
keywords_hinglish:
  - "loan app wale blackmail kar rahe hain"
  - "7 day loan app harassment"
  - "loan app mere contacts par photo bhej raha hai"
  - "fake loan app complaint kaise kare"
sample_queries:
  - "Instant loan app agents are threatening to send morphed photos to my contacts"
  - "Loan app harassment se kaise bache"
  - "फर्जी लोन ऐप वाले मेरे रिश्तेदारों को गंदी फोटो भेजने की धमकी दे रहे हैं"
answer_en:
  - "1. STOP PAYING EXTORTION: Illegal 7-day loan apps never mark the loan 'closed' even after payment; paying more only increases demands."
  - "2. Uninstall the Loan App & Revoke Permissions: First go to Settings -> Apps -> [Loan App] -> Permissions -> Deny Contacts, Storage/Photos, Call Logs, Camera, Location -> Force Stop -> Uninstall."
  - "3. Inform Trusted Contacts Calmly: Send a short honest message to family/friends: 'My phone data was misused by a cyber fraud app — please ignore and block any fake photo/loan message about me.'"
  - "4. Preserve Evidence: Save screenshots of the app name/APK, threatening WhatsApp calls/messages, UPI IDs/accounts you paid, and bank statements."
  - "5. Report on cybercrime.gov.in AND RBI Sachet (for unauthorized digital lenders) — also call 1930 if money was extorted or deducted."
  - "6. Use StopNCII.org if any intimate/private photo from your gallery is threatened to be shared on social media."
  - "7. Only take loans from RBI-registered banks/NBFCs; never install loan apps from WhatsApp links or unknown APK sites."
answer_hi:
  - "1. डरकर बार-बार पैसे न दें: अवैध 7-दिन वाले लोन ऐप पैसे देने के बाद भी लोन बंद नहीं दिखाते और लगातार ज्यादा रकम मांगते हैं।"
  - "2. तुरंत ऐप की परमिशन बंद कर Uninstall करें: Settings -> Apps -> [Loan App] -> Permissions में जाकर Contacts, Photos/Storage, Camera व Call Logs की परमिशन हटाएं (Deny करें) और ऐप Uninstall करें।"
  - "3. परिवार व जानकारों को पहले ही बता दें: अपने नजदीकी लोगों को साफ संदेश भेज दें — 'मेरे फोन का डेटा एक साइबर ठग ऐप ने चुरा लिया है, मेरे नाम से कोई फर्जी फोटो या लोन मैसेज आए तो अनदेखा कर नंबर ब्लॉक कर दें।' इससे ब्लैकमेलर की ताकत खत्म हो जाती है।"
  - "4. सबूत सुरक्षित रखें: ऐप का नाम/स्क्रीनशॉट, धमकी भरे WhatsApp नंबर, कॉल/चैट के स्क्रीनशॉट और जिन UPI/खातों में पैसे भेजे उनकी रसीद संभाल कर रखें।"
  - "5. cybercrime.gov.in पर तुरंत शिकायत दर्ज करें (और पैसों की वसूली हुई हो तो 1930 पर भी कॉल करें)।"
  - "6. यदि आपकी कोई निजी तस्वीर वायरल करने की धमकी दी जा रही है, तो StopNCII.org टूल का उपयोग करें।"
  - "7. आगे से केवल RBI से पंजीकृत बैंक/NBFC ऐप से ही लोन लें; WhatsApp लिंक या अनजान वेबसाइट से APK लोन ऐप कभी डाउनलोड न करें।"
