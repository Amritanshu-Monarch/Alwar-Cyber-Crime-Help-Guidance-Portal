[project]
name = "alwar-cyber-agent"
version = "0.1.0"
description = "Voice + RAG agent backend for the Alwar Cyber Crime Help & Guidance Portal"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "google-adk",
  "google-genai",
  "chromadb",
  "pydantic-settings",
  "python-multipart",
  "python-dotenv",
  "slowapi",
  "rank-bm25",
]

[dependency-groups]
dev = ["pytest", "httpx"]
eval = [
  "deepeval==4.3.4",
  "ragas==0.4.4",
  "arize-phoenix==20.19.0",
  "arize-phoenix-otel==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation/tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as real Gemini API tests requiring GOOGLE_API_KEY (deselected by default)",
]
